<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トリミングログ2">
<meta name="theme-color" content="#ffffff">
<title>トリミングログ</title>
<style>
:root{--main:#e8758f;--bg:#fff7f8;--text:#333;--sub:#888;--line:#f3e3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#fff;border-bottom:1px solid #f0d5db;position:sticky;top:0;z-index:5;min-height:52px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:16px 16px 40px;max-width:600px;margin:0 auto}
main.pb{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;margin:8px 0}
a.btn{text-align:center;text-decoration:none}
.btn.sub{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.danger{background:#fff;color:#d33;border:2px solid #d33}
.btn.big{padding:18px;font-size:18px;margin:12px 0}
.btn.small{padding:11px;font-size:14px;margin:0}
.link{display:block;width:100%;background:none;border:none;color:var(--main);font-size:15px;font-weight:bold;padding:12px 0 2px;text-align:center}
.link.danger{color:#d33;margin-top:16px}
.back{background:none;border:none;font-size:16px;color:var(--main);padding:0;flex:none}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card>label:first-child{margin-top:0}
.card.alert{border:2px solid var(--main)}
.sec{font-size:16px;font-weight:bold;margin:26px 0 8px;padding-left:10px;border-left:5px solid var(--main)}
main>.sec:first-child{margin-top:4px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
label.chk input{width:22px;height:22px;flex:none;margin:0}
.req{color:#d33;font-weight:bold;font-size:12px;margin-left:4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;background:#fff;font-family:inherit;color:var(--text)}
textarea{min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.photo{aspect-ratio:3/4;background:#f3e3e6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;font-size:13px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.big{background:#f7f7f7}
.photo.big img{object-fit:contain}
.count{font-size:36px;font-weight:bold;color:var(--main);line-height:1.2}
.muted{color:var(--sub);font-size:13px}
.pre{white-space:pre-wrap}
.tag{display:inline-block;padding:6px 12px;margin:4px;border-radius:20px;border:1px solid var(--main);color:var(--main);font-size:14px}
.tag.off{border-color:#ccc;color:#bbb;text-decoration:line-through}
.chip{display:inline-block;padding:8px 12px;margin:4px 4px 0 0;border-radius:20px;border:1px solid #ddd;color:#888;font-size:14px;background:#fff}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.chip.mine{border-color:var(--main);color:var(--main)}
.list-item{display:flex;align-items:center;gap:12px}
.list-item .photo{width:56px;flex:none;border-radius:8px}
.minicall{flex:none;padding:8px 12px;border:2px solid var(--main);border-radius:10px;color:var(--main);background:#fff;font-weight:bold;text-decoration:none;font-size:13px}
.mrow{display:flex;align-items:center;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gitem{background:#fff;border-radius:14px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px}
.gitem .photo{margin-bottom:6px;border-radius:10px}
.stars{display:flex;gap:6px}
.stars button{flex:none;width:44px;height:44px;border:none;background:none;font-size:34px;color:#ddd;padding:0;line-height:1}
.stars button.on{color:#f5b301}
.star{color:#f5b301;letter-spacing:1px}
.star0{color:#ddd;letter-spacing:1px}
.order{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
.order h2{margin:14px 0 2px;font-size:24px}
.order .memo{font-size:26px;line-height:1.6;white-space:pre-wrap;font-weight:bold;margin-top:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #f0d5db;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabbar button{flex:1;border:none;background:none;padding:16px 0 14px;font-size:14px;font-weight:bold;color:#aaa;border-top:3px solid transparent}
.tabbar button.on{color:var(--main);border-top-color:var(--main)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0d5db;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.savebar .btn{margin:0 auto;max-width:568px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.remrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.remrow select{flex:1.2}.remrow input{flex:1}
.remrow button{flex:none;width:44px;height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#d33;font-size:18px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:14px;font-weight:bold}
.seg button.on{background:var(--main);color:#fff}
.seg.sm button{font-size:13px;padding:10px 2px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{flex:none;width:50px;text-align:center;font-size:11px;color:var(--sub);background:none;border:none;padding:0}
.sw i{display:block;width:40px;height:40px;margin:0 auto 3px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}
.sw.on{color:var(--main);font-weight:bold}
.sw.on i{box-shadow:0 0 0 3px var(--main)}
/* 投稿画像 */
#xcv{display:block;margin:0 auto;max-width:100%;max-height:50vh;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.15);touch-action:none;-webkit-user-select:none;user-select:none}
.xsel{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff}
.xl{font-size:13px;color:var(--sub);margin:14px 0 6px}.xl:first-child{margin-top:0}
.xx{border:none;background:none;color:#bbb;font-size:15px;padding:0 2px 0 4px}
label.xck{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--text);margin:0}
.xck input{width:24px;height:24px;flex:none;margin:0}
.xnote{font-size:12px;color:var(--sub);margin:6px 0 0}
/* ワンちゃん・お店で見せる */
.dphoto{width:56px;height:56px;flex:none;border-radius:50%;background:#f3e3e6;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px}
.dphoto img{width:100%;height:100%;object-fit:cover}
.xedit{flex:none;padding:8px 12px;border:2px solid var(--main);border-radius:10px;color:var(--main);background:#fff;font-weight:bold;font-size:13px}
.xstar{flex:none;width:44px;height:44px;border:none;background:none;font-size:28px;color:#f5b301;padding:0}
.xmemo{font-size:22px;line-height:1.6;white-space:pre-wrap;font-weight:bold}
.xlink{flex:none;color:var(--main);font-weight:bold;font-size:14px}
/* 予約・お店のボタン */
.xbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.xnear{font-weight:bold;margin-bottom:2px}
.resrow{padding:14px 0;border-top:2px solid #f0d5db}
.resrow.first{border-top:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 定数 ===== */
const APP_NAME='トリミングログ';
const APP_TAG='#トリミングログ';
const DB_NAME='trimlog2',ALBUM_DB='trimlog2_album';
const DAYS=[0,1,2,3,5,7,10,14,21,30];
const DEF_REM=[{d:1,t:'20:00'},{d:0,t:'09:00'}];
const IVS=[0,14,21,28,30,40,45,60,90];
const DEF_IV=30,DEF_RT='10:00';
const MENUS=['カット','シャンプー','部分カット','爪切り','耳そうじ','肛門腺しぼり','歯みがき','パック・スパ'];
const CONDS=['元気','いつも通り','少し元気がない','体調が悪い'];
const STYLES=[
  {name:'ピンク',bg:'#fff7f8',text:'#e8758f',label:'#e8758f',labelText:'#fff'},
  {name:'ダーク',bg:'#2b2b2b',text:'#fff',label:'#f7c948',labelText:'#2b2b2b'},
  {name:'ミント',bg:'#f0faf6',text:'#3a9e7e',label:'#5cbf9b',labelText:'#fff'},
  {name:'ベージュ',bg:'#f7f1e8',text:'#8a6a4a',label:'#b08860',labelText:'#fff'},
  {name:'スカイ',bg:'#f0f6ff',text:'#4a7fc1',label:'#6a9fe0',labelText:'#fff'},
  {name:'モノクロ',bg:'#ffffff',text:'#222',label:'#222',labelText:'#fff'}];
const DEF_PHRASES=['さっぱりしました','今月もかわいくしてもらいました','シャンプーでふわふわ','夏仕様のショートカット','お気に入りのカット'];
const FONT='-apple-system,"Hiragino Sans",sans-serif';
const WD='日月火水木金土';
const DAY=86400000;
const TABS=[['home','ホーム'],['history','アルバム'],['settings','設定']];
const TAB_IDS=TABS.map(t=>t[0]);

/* ===== 共通の部品 ===== */
const $=s=>document.querySelector(s);
const qa=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const nowTime=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const fmtDate=s=>s?s.replace(/-/g,'/'):'';
const visitStr=r=>fmtDate(r.date)+(r.time?' '+r.time:'');
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
const daysTo=s=>{const n=new Date(s),t=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)};
const yen=p=>p?'¥'+Number(p).toLocaleString():'';
const dayLabel=d=>d===0?'当日':d+'日前';
const validRems=list=>(Array.isArray(list)?list:[]).filter(o=>o&&typeof o==='object'&&typeof o.d==='number');
const remText=list=>validRems(list).map(x=>dayLabel(x.d)+'の'+x.t).join('、')||'なし';
const memoOf=r=>r.memo??r.order??r.note??'';
const starHtml=n=>n?`<span class="star">${'★'.repeat(n)}</span><span class="star0">${'★'.repeat(5-n)}</span>`:'';
const digits=s=>String(s||'').replace(/\D/g,'');
const telHref=t=>'tel:'+String(t||'').replace(/[^\d+]/g,'');
const mapUrl=a=>'https://maps.apple.com/?q='+encodeURIComponent(a);
function lineUrl(v){v=String(v||'').trim();if(!v)return'';if(/^https?:\/\//.test(v))return v;if(v[0]!=='@')v='@'+v;return 'https://line.me/R/oaMessage/'+encodeURIComponent(v)+'/'}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

/* ===== 保存（IndexedDB：trimlog2） ===== */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbGet(k){return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbSet(k,v){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDel(k){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbClear(){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

let S={dogs:[],places:[],records:[],favs:[],resv:[],settings:{defRem:clone(DEF_REM)}};
const imgCache=new Map();
const save=()=>dbSet('state',S);
let saveTm=0;
function laterSave(){clearTimeout(saveTm);saveTm=setTimeout(()=>save(),500)}
async function putImg(data){const id='img_'+uid();await dbSet(id,data);imgCache.set(id,data);return id}
async function getImg(id){if(!id)return null;if(imgCache.has(id))return imgCache.get(id);const v=await dbGet(id);if(v)imgCache.set(id,v);return v}
async function delImg(id){if(id){await dbDel(id);imgCache.delete(id)}}
async function hydrate(){for(const el of document.querySelectorAll('img[data-img]')){const v=await getImg(el.dataset.img);if(v)el.src=v}}

/* ===== データを探す ===== */
const set=()=>{S.settings=S.settings||{};return S.settings};
const dog=id=>S.dogs.find(d=>d.id===id);
const activeDogs=()=>S.dogs.filter(d=>!d.hidden);
const dogLabel=d=>esc(d.name)+(d.hidden?'（非表示）':'');
const place=id=>S.places.find(p=>p.id===id)||S.places[0];
const recOf=id=>S.records.find(r=>r.id===id);
const favOf=id=>S.favs.find(f=>f.id===id);
const favOfRec=r=>S.favs.find(f=>f.recId===r.id);
const resOf=id=>S.resv.find(x=>x.id===id);
const linkedRes=recId=>S.resv.find(x=>x.fromRec===recId);
const byNew=(a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||'')||b.created-a.created;
const recsOf=dogId=>S.records.filter(r=>r.dogId===dogId).sort(byNew);
const cover=r=>r.after||r.before;
const normTags=s=>[...new Set(String(s).split(/[\s,、　]+/).filter(Boolean).map(t=>'#'+t.replace(/^[#＃]+/,'')).filter(t=>t.length>1))].slice(0,5);
const tagsOf=p=>!p?[]:Array.isArray(p.tags)?p.tags:normTags(p.tags||'');
const shopTag=p=>!p||p.id==='home'?null:'#'+String(p.name||'').replace(/[\s　#＃]+/g,'');
const placeOpts=cur=>S.places.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('');

/* ===== お店の追加情報（住所・LINE・メモ：S.settings.shopX に店名で保存） ===== */
const shopX=()=>{const s=set();return s.shopX=s.shopX||{}};
const shopInfo=p=>{if(!p)return{addr:'',line:'',memo:''};const x=shopX()[p.name]||{};return{addr:x.addr||p.addr||'',line:x.line||'',memo:x.memo||p.xmemo||''}};
const placeByTel=h=>{const t=digits(h);return t?S.places.find(p=>p.tel&&digits(p.tel)===t):null};
/* 電話・LINE・マップのボタン（予約・ランキング以外の一覧で共通） */
function shopBtns(p){if(!p||p.id==='home')return'';const i=shopInfo(p),stop='onclick="event.stopPropagation()"';
  return `<div class="xbtns">${p.tel?`<a class="minicall" href="${telHref(p.tel)}" ${stop}>電話</a>`:''}${i.line?`<a class="minicall" href="${esc(lineUrl(i.line))}" ${stop}>LINE</a>`:''}<a class="minicall" href="${esc(mapUrl(i.addr||p.name))}" ${stop}>マップ</a></div>`}
function placeBtns(p){if(!p||p.id==='home')return'';
  return `${p.hours?`<div class="muted pre" style="margin-top:8px">営業時間・定休日：${esc(p.hours)}</div>`:''}${p.tel?`<a class="btn sub" href="${telHref(p.tel)}">電話する（${esc(p.tel)}）</a>`:''}`}
const dogFilter=(cur,on)=>S.dogs.length>1?`<select onchange="${on}" style="margin-top:10px"><option value="">すべてのワンちゃん</option>${S.dogs.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${dogLabel(d)}</option>`).join('')}</select>`:'';

/* ===== 写真（アプリの中にコピーして保存） ===== */
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadSrc(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function toPhoto(file){
  const url=URL.createObjectURL(file);
  try{const im=await loadSrc(url);const r=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}
  finally{URL.revokeObjectURL(url)}}
function dataToFile(src,name){const[h,b]=src.split(',');const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new File([u],name||'trimming.jpg',{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
function shareFiles(files){if(navigator.canShare&&navigator.canShare({files}))return navigator.share({files}).catch(()=>{});
  files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()})}
function copyText(t){if(navigator.clipboard)return navigator.clipboard.writeText(t).then(()=>true).catch(()=>false);
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();return Promise.resolve(true)}

/* ===== 画面の切り替え ===== */
const V={},AFTER={};
let view='home',param=null,stack=[],wl=null,JUST=null;
function relWL(){if(wl){wl.release().catch(()=>{});wl=null}}
function go(v,p,o){if(view==='order'&&v!=='order')relWL();
  if(TAB_IDS.includes(v)){stack=[];JUST=null}else if(!(o&&o.replace))stack.push([view,param,window.scrollY]);
  view=v;param=p;render();window.scrollTo(0,0)}
function back(){if(view==='order')relWL();const b=stack.pop()||['home',null,0];view=b[0];param=b[1];render();window.scrollTo(0,b[2]||0)}
function render(){const pop=$('#x_bkpop');if(pop&&view!=='backup')pop.remove();
  $('#app').innerHTML=(V[view]||V.home)(param);hydrate();if(AFTER[view])AFTER[view](param)}
function shell(title,body,o){o=o||{};const tab=TAB_IDS.includes(view);const b=o.back===1||o.back===true?'back()':o.back;
  return `<header>${b?`<button class="back" onclick="${b}">‹ 戻る</button>`:''}<h1>${esc(title)}</h1></header><main class="${tab||o.bar?'pb':''}">${body}</main>${o.bar?`<div class="savebar">${o.bar}</div>`:''}${tab?`<nav class="tabbar">${TABS.map(([v,l])=>`<button class="${v===view?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}</nav>`:''}`}
const installHint=()=>navigator.standalone?'':`<div class="card muted">Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように使えて、データも消えにくくなります。</div>`;
function dogField(id,cur,on){let list=activeDogs();const c=dog(cur);if(c&&c.hidden)list=[...list,c];if(!list.length)list=S.dogs.slice(0,1);
  return list.length===1?`<input type="hidden" id="${id}" value="${list[0].id}">`:`<label>ワンちゃん</label><select id="${id}"${on?` onchange="${on}"`:''}>${list.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${dogLabel(d)}</option>`).join('')}</select>`}
const firstDog=()=>(activeDogs()[0]||S.dogs[0]).id;

/* ===== 通知の編集 ===== */

function readRems(){return qa('.remrow').map(el=>({d:Number(el.querySelector('.rem_d').value),t:el.querySelector('.rem_t').value||'09:00'}))}
let RD=null,D=null,R=null;
function remList(){if(view==='recEdit'){syncD();return D.rem}if(view==='resEdit'){syncR();return R.rem}RD=readRems();return RD}
function addRem(){remList().push({d:0,t:'09:00'});render()}
function delRem(i){remList().splice(i,1);render()}

/* ===== 予約一覧・そろそろ予約 ===== */
function upcoming(){const now=new Date();
  return S.resv.filter(x=>x.at&&new Date(x.at)>now&&!dog(x.dogId)?.hidden).sort((x,y)=>x.at.localeCompare(y.at))}
function dueDate(d,r){const t=new Date(r.date+'T00:00');t.setDate(t.getDate()+Number(d.interval));const[h,m]=String(d.rTime||DEF_RT).split(':').map(Number);t.setHours(h||0,m||0,0,0);return t}
function dueOf(d,ups){if(d.hidden||!(Number(d.interval)>0))return null;if(ups.some(u=>u.dogId===d.id))return null;
  const r=recsOf(d.id)[0];if(!r)return null;const due=dueDate(d,r);return daysTo(due)<=0?{r,due}:null}
const resRow=(x,first)=>{const p=place(x.placeId)||{};
  return `<div class="resrow${first?' first':''}" onclick="editRes('${x.id}')"><div class="list-item"><div style="flex:1"><b>${fmtDT(x.at)}</b><div class="muted">${esc(dog(x.dogId)?.name)}・${esc(p.name)}</div>${x.menu?`<div class="muted">${esc(x.menu)}</div>`:''}</div><span class="muted">›</span></div>${p.tel?shopBtns(p):''}</div>`};
function resBox(ups,dogId){let h='<p class="muted" style="margin:4px 0 0">予約はまだありません</p>';
  if(ups.length){const n=daysTo(ups[0].at);h=`<div class="muted xnear">直近の予約まで</div><div class="count">${n===0?'今日':'あと'+n+'日'}</div>${ups.map((x,i)=>resRow(x,i===0)).join('')}`}
  return h+`<button class="btn sub" style="margin-top:14px" onclick="newRes(${dogId?`'${dogId}'`:''})">＋ 予約を追加</button>`}

/* ===== ホーム ===== */
const dogPic=(d,size)=>{const s=size?`width:${size}px;height:${size}px`:'';
  if(d&&d.icon)return `<div class="dphoto" style="${s}"><img src="${d.icon}"></div>`;
  const r=d?recsOf(d.id)[0]:null,c=r&&cover(r);
  return `<div class="dphoto" style="${s}">${c?`<img data-img="${c}">`:'写真なし'}</div>`};
function bkNotice(){const s=set();if(!S.records.length)return'';const now=Date.now();
  if(s.bkSnooze&&s.bkSnooze>now)return'';if(s.lastBk&&now-s.lastBk<14*DAY)return'';
  const msg=s.lastBk?`前回のバックアップから${Math.floor((now-s.lastBk)/DAY)}日たちました。`:'まだバックアップしていません。';
  return `<div class="card alert"><b>バックアップしませんか？</b><div class="muted">${msg}アプリを消したときなどに、記録と写真が消えてしまうことがあります。</div><div class="row" style="margin-top:10px"><button class="btn sub small" onclick="xBkLater()">あとで</button><button class="btn small" onclick="BK=null;go('backup')">バックアップする</button></div></div>`}
function xBkLater(){set().bkSnooze=Date.now()+3*DAY;save();render()}
function homeShops(){const list=S.places.filter(p=>p&&p.id!=='home'&&p.name&&!p.hidden);
  const cards=list.map(p=>{const i=shopInfo(p);
    return `<div class="card" onclick="go('placeEdit',{id:'${p.id}'})" style="cursor:pointer"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-weight:bold;font-size:16px">${esc(p.name)}</div>${i.addr?`<div class="muted" style="margin-top:2px">${esc(i.addr)}</div>`:''}${i.memo?`<div class="muted" style="margin-top:2px">${esc(i.memo)}</div>`:''}</div><span style="color:#bbb">›</span></div>${shopBtns(p)}</div>`}).join('');
  return `<div class="sec">お店</div>${cards||'<p class="muted">行ったお店を登録すると、ここから電話やLINEができます。</p>'}<button class="btn sub" onclick="go('placeEdit',{})">＋ お店を追加</button>`}

  return shell(APP_NAME,`${bkNotice()}${dueHtml}<div class="sec">次回の予約</div><div class="card">${resBox(ups)}</div>

async function xFav(id){const r=recOf(id);if(!r)return;const f=favOfRec(r);

  const name=prompt('お気に入りの名前',(r.menus||[]).join('・')||'お気に入りのカット');if(name===null)return;

<div class="sec">表示</div><div class="card">${id?`<label class="chk"><input type="checkbox" id="f_hide" ${d.hidden?'checked':''}>ホームや選択肢に表示しない</label><p class="muted">記録と写真は消えません。「アルバム」タブで見返せます。あとから戻すこともできます。</p>`:''}<label class="chk"><input type="checkbox" id="f_ahide" ${ahide?'checked':''}>アルバムに表示しない</label></div>

async function saveDog(id){const name=$('#f_name').value.trim();if(!name)return toast('名前を入れてください');
  const data={name,breed:$('#f_breed').value.trim(),interval:Number($('#f_iv').value)||0,rTime:$('#f_rt').value||DEF_RT,hidden:!!($('#f_hide')&&$('#f_hide').checked)};
  let d;if(id){d=dog(id);Object.assign(d,data)}else{d={id:uid(),...data};if(PEND)d.icon=PEND;S.dogs.push(d)}PEND=null;
  const s=set(),ah=new Set(s.albumHide||[]);if($('#f_ahide')&&$('#f_ahide').checked)ah.add(d.id);else ah.delete(d.id);s.albumHide=[...ah];
  await save();toast('保存しました');back()}
async function delDog(id){if(!confirm('このワンちゃんと、すべての記録・写真を削除します。元に戻せません。\n\n表示だけ消したいときは「表示しない」にチェックしてください。\n\n削除しますか？'))return;for(const r of S.records.filter(r=>r.dogId===id)){await delImg(r.before);await delImg(r.after)}S.records=S.records.filter(r=>r.dogId!==id);S.resv=S.resv.filter(x=>x.dogId!==id);S.dogs=S.dogs.filter(d=>d.id!==id);await save();back()}
async function xDogPhoto(id){const f=await pickFile('image/*');if(!f)return;const url=URL.createObjectURL(f);
  try{const im=await loadSrc(url);const s=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement('canvas');c.width=c.height=360;
    c.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,360,360);const data=c.toDataURL('image/jpeg',0.85);
    if(id){const d=dog(id);if(d){d.icon=data;await save();toast('写真を保存しました')}}else PEND=data;
    const el=$('#x_dpc');if(el)el.outerHTML=dpCard(id,data)}
  catch(e){toast('写真を読み込めませんでした')}finally{URL.revokeObjectURL(url)}}
async function xDogPhotoDel(id){if(!confirm('写真を消しますか？'))return;
  if(id){const d=dog(id);if(d){delete d.icon;await save()}}else PEND=null;
  const el=$('#x_dpc');if(el)el.outerHTML=dpCard(id,'')}

/* ===== カレンダー（.icsファイル） ===== */
const icsDT=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function openIcs(evs){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//trimlog//JP','CALSCALE:GREGORIAN'];
  for(const e of evs){L.push('BEGIN:VEVENT','UID:'+uid()+'@trimlog','DTSTAMP:'+icsUTC(new Date()),'DTSTART:'+icsDT(e.start),'DTEND:'+icsDT(e.end),'SUMMARY:'+icsEsc(e.title));
    if(e.desc)L.push('DESCRIPTION:'+icsEsc(e.desc));if(e.loc)L.push('LOCATION:'+icsEsc(e.loc));
    for(const t of e.alarms||[])L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),t,'END:VALARM');
    L.push('END:VEVENT')}
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='trimming.ics';document.body.appendChild(a);a.click();a.remove()}
function calItem(o){const d=dog(o.dogId),p=place(o.placeId)||{},start=new Date(o.at);
  if(!o.at||isNaN(start))return toast('予約日時が入っていません');
  const end=new Date(start.getTime()+3600000),title=`${d?.name||''} トリミング（${p.name||''}）`;
  const desc=[o.menu?'予約内容：'+o.menu:'',p.tel&&p.id!=='home'?'電話：'+p.tel:''].filter(Boolean).join('\n');
  const ts=validRems(o.rem).map(x=>{const t=new Date(start);t.setDate(t.getDate()-x.d);const[h,m]=String(x.t||'09:00').split(':').map(Number);t.setHours(h||0,m||0,0,0);return t}).sort((a,b)=>a-b);
  const evs=[{start,end,title,desc,loc:p.id==='home'?'':p.name,alarms:ts.slice(0,2).map(t=>'TRIGGER;VALUE=DATE-TIME:'+icsUTC(t))}];
  ts.slice(2).forEach(t=>evs.push({start:t,end:new Date(t.getTime()+900000),title:'【通知】'+title,desc,alarms:['TRIGGER:PT0M']}));
  openIcs(evs);if(ts.length>2)toast('通知が3つ以上あるので、カレンダーで「すべてを追加」を選んでください')}

/* ===== 投稿画像・まとめて1枚 ===== */
(function(){

/* 犬のイラスト（白い背景を自動で抜く） */
function cutBg(im){const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0);

  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(qh<qt){const i=q[qh++],X0=i%w;if(X0>0)push(i-1);if(X0<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*h-w)push(i+w)}

const DOGS=[['dog.png','スムース'],['dog2.png','ロング'],['dog3.png','ブラタン']].map(([src,n])=>{

/* 設定 */
function cfg(){const s=set();const c=s.xp=s.xp||{};

  if(!Array.isArray(s.myTags))s.myTags=[];

  return c}
function xp(r){const p=r.xp=r.xp||{},o=r.pt||{};

  if(!p.lbB)p.lbB='BEFORE';if(!p.lbA)p.lbA='AFTER';if(!Array.isArray(p.off))p.off=[];p.crop=p.crop||{};return p}
/* シンプルではタイトル・ひとことを入れない（保存した文字は消さずに残す） */
const textOf=(c,p)=>c.tpl==='none'?{...p,title:'',sub:''}:p;
const lay=(c,r)=>r.before&&r.after?c.lay:'one';
async function loadImgs(ids){for(const id of ids){if(id&&!X.imgs[id]){const s=await getImg(id);if(s){try{X.imgs[id]=await loadSrc(s)}catch(e){}}}}}
const sc=(s,im)=>(cfg().fit==='contain'?Math.min:Math.max)(s.w/im.naturalWidth,s.h/im.naturalHeight);

/* 描画の部品 */
function isLight(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);if(isNaN(n))return false;return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255>0.7}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function paw(ctx,x,y,r,col,a){ctx.save();ctx.translate(x,y);ctx.rotate(a||0);ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,r*0.35,r*0.62,r*0.5,0,0,7);ctx.fill();
  [[-0.62,-0.3],[-0.22,-0.68],[0.22,-0.68],[0.62,-0.3]].forEach(([dx,dy])=>{ctx.beginPath();ctx.ellipse(dx*r,dy*r,r*0.2,r*0.26,dx*0.5,0,7);ctx.fill()});ctx.restore()}
function bone(ctx,x,y,l,col,a){ctx.save();ctx.translate(x,y);ctx.rotate(a||0);ctx.fillStyle=col;const t=l*0.18;ctx.fillRect(-l/2,-t/2,l,t);

function chi(ctx,cx,cy,s){const d=DOGS[cfg().dog]||DOGS[0];ctx.save();
  if(d.im){const w=s*2.4,h=w*d.im.height/d.im.width;ctx.drawImage(d.im,cx-w/2,cy-h/2-s*0.2,w,h)}
  else{ctx.font=Math.round(s*2.2)+'px "Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐶',cx,cy-s*0.2)}
  ctx.restore()}
function mark(ctx,st,xr,y){ctx.save();ctx.globalAlpha=.6;ctx.fillStyle=st.text;ctx.font='bold 30px '+FONT;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(APP_NAME,xr,y);ctx.restore()}
function pill(ctx,text,x,y,st,f){const fs=Math.round(40*f);ctx.font='bold '+fs+'px '+FONT;const w=ctx.measureText(text).width+fs*1.2,h=fs*1.6;

/* テンプレート */
function frame(ctx,c,p,W,H,A,f){const st=STYLES[c.style]||STYLES[0],feed=c.dest!=='reel';ctx.fillStyle=st.bg;ctx.fillRect(0,0,W,H);
  if(c.tpl==='none'){const FN='"Hiragino Sans",sans-serif',T=(t,fs,y,w)=>{let s=fs;do{ctx.font=w+' '+s+'px '+FN;s-=4}while(s>20&&ctx.measureText(t).width>A.x1-A.x0-60);ctx.fillText(t,W/2,y)};
    return{st,L:0,R:W,top:0,bottom:H,gap:6,rad:0,fr:false,foot:()=>{ctx.save();ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.globalAlpha=.85;ctx.font='bold 34px '+FN;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(APP_NAME,A.x1-30,A.y1-30);ctx.globalAlpha=1;ctx.textAlign='center';let y=A.y1-110;if(p.sub){T(p.sub,50*f,y,'');y-=70*f}if(p.title)T(p.title,84*f,y,'bold');ctx.restore()}}}
  const pad=24,L=A.x0+pad,R=A.x1-pad;
  if(c.tpl==='chihuahua'){
    ctx.save();ctx.globalAlpha=.12;for(let i=0;i<16;i++)paw(ctx,(i*397+80)%W,(i*613+150)%H,26,st.label,((i*53)%360)*Math.PI/180);ctx.restore();
    const k=feed?0.76:1,hh=250*k,s=96*k,y0=A.y0;

      const bx=cx+s*1.15,by=y0+hh*0.2,bw=R-bx,bh=hh*0.68;

/* 写真の置き場所 */
function slotsFor(c,r,p,G){const w=G.R-G.L,h=G.bottom-G.top,L=lay(c,r);
  const lb=k=>p.lb?(k==='a'?p.lbA:p.lbB):'';

  if(L==='one')return one(r.after?'a':'b');if(L==='after')return one('a');if(L==='sep')return one(X.sepK);
  if(L==='v'){const hh=(h-G.gap)/2;return[{k:'b',id:r.before,x:G.L,y:G.top,w,h:hh,text:lb('b')},{k:'a',id:r.after,x:G.L,y:G.top+hh+G.gap,w,h:hh,text:lb('a')}]}

function grid(items,G){const n=items.length;if(!n)return[];const cols=n===1?1:2,rows=Math.ceil(n/cols),w=G.R-G.L,h=G.bottom-G.top;

  return items.map((r,i)=>{const row=Math.floor(i/cols),col=i%cols,inRow=Math.min(cols,n-row*cols);let x=G.L+col*(cw+G.gap);if(inRow<cols)x+=(cw+G.gap)/2;
    return{k:'g'+r.id,id:cover(r),x,y:G.top+row*(ch+G.gap),w:cw,h:ch,text:(dog(r.dogId)||{}).name||''}})}
const ckPre=(c,r)=>c.dest+'|'+c.tpl+'|'+lay(c,r)+'|'+c.fit+'|';

/* 画像を作る */
function paint(cv,c,p,mk,getCrop){const[W,H,sf0]=SZ[c.dest],f=TS[c.ts][1];cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  const sf=c.tpl==='none'&&c.dest==='feed'?[20,20,20,20]:sf0;
  const A={x0:sf[3],y0:sf[0],x1:W-sf[1],y1:H-sf[2]};const G=frame(ctx,c,p,W,H,A,f);const slots=mk(G);

    const im=X.imgs[s.id],cr=getCrop(s);ctx.save();rr(ctx,s.x,s.y,s.w,s.h,G.rad);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.w,s.h);
    if(im){const b=sc(s,im)*cr.z,dw=im.naturalWidth*b,dh=im.naturalHeight*b;ctx.drawImage(im,s.x+s.w/2-dw/2+cr.x,s.y+s.h/2-dh/2+cr.y,dw,dh)}

function bulkPaint(cv){const c=cfg(),items=X.bulk.map(recOf).filter(r=>r&&cover(r)).slice(0,6);return paint(cv,c,textOf(c,{title:X.bt,sub:''}),G=>grid(items,G),bcrop)}

  if(view==='xbulk')X.slots=bulkPaint(cv);else{const r=recOf(X.id);if(!r)return;X.slots=onePaint(cv,r)}prep()}
function redraw(){cancelAnimationFrame(X.raf);X.raf=requestAnimationFrame(draw)}
const blobOf=cv=>new Promise(res=>cv.toBlob(res,'image/jpeg',0.92));
async function build(){const out=[];
  if(view==='xbulk'){const cv=document.createElement('canvas');bulkPaint(cv);const b=await blobOf(cv);return b?[new File([b],'trimming.jpg',{type:'image/jpeg'})]:null}
  const r=recOf(X.id);if(!r)return null;const ks=lay(cfg(),r)==='sep'?['b','a']:[null],keep=X.sepK;
  for(const k of ks){if(k)X.sepK=k;const cv=document.createElement('canvas');onePaint(cv,r);X.sepK=keep;const b=await blobOf(cv);if(!b)return null;
    out.push(new File([b],(k?(k==='b'?'1_before':'2_after'):'trimming')+'.jpg',{type:'image/jpeg'}))}

/* 指で動かす */
function bindCv(){const cv=document.getElementById('xcv');if(!cv||cv.dataset.b)return;cv.dataset.b=1;
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  const hit=q=>X.slots.find(s=>q.x>=s.x&&q.x<=s.x+s.w&&q.y>=s.y&&q.y<=s.y+s.h);
  const crOf=s=>view==='xbulk'?bcrop(s):cropOf(recOf(X.id),cfg(),s.k,s.id);

  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}

V.xpost=id=>{X.id=id;const r=recOf(id);if(!r)return shell('投稿画像','<p class="muted">記録が見つかりません。</p>',{back:1});

  const dogsSel=c.tpl==='chihuahua'?`<div class="xl">イラスト</div>${seg(Object.fromEntries(DOGS.map((d,i)=>[i,d.n])),c.dog,'dog')}`:'';
  const sws=`<div class="sws">${STYLES.map((st,i)=>`<button class="sw ${i===c.style?'on':''}" onclick="xpSet('style','${i}')"><i style="background:${st.bg}"></i>${esc(st.name)}</button>`).join('')}</div>`;

/* ===== アルバム ===== */
(function(){const st=document.createElement('style');st.textContent='.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.athumb{position:relative;aspect-ratio:1;background:#f3e3e6;border-radius:6px;overflow:hidden}.athumb img{width:100%;height:100%;object-fit:cover}.athumb span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:8px}.athumb.on{outline:4px solid var(--main);outline-offset:-4px}#acv{display:block;margin:0 auto;max-width:100%;max-height:50vh;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.15)}';document.head.appendChild(st)})();
const KINDS={xmas:'クリスマス',ny:'お正月',grow:'成長アルバム',year:'1年まとめ'};
const SHAPES={reel:['縦長（9:16）',1080,1920],feed:['少し縦長（4:5）',1080,1350],sq:['正方形',1080,1080]};
const FLT={all:'すべて',after:'アフター',before:'ビフォー',fav:'★ お気に入り'};
const DEF_ATAGS=['お散歩','お出かけ','誕生日'];
let AD={list:[],tags:DEF_ATAGS.slice(),tagOf:{}};
const Z={dog:'',flt:'all'};
const M={kind:'xmas',per:'all',shape:'feed',style:0,title:'',edited:false,sel:[],key:''};
const ACache=new Map();
let adbp=null;
const adb=()=>adbp=adbp||new Promise((res,rej)=>{const q=indexedDB.open(ALBUM_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function aget(k){const d=await adb();return new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
async function aset(k,v){const d=await adb();return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite'),o=tx.objectStore('kv');if(v===undefined)o.delete(k);else o.put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function aload(){const v=await aget('data');if(v&&typeof v==='object')AD={list:Array.isArray(v.list)?v.list:[],tags:Array.isArray(v.tags)?v.tags:DEF_ATAGS.slice(),tagOf:v.tagOf||{}}}
async function saveAD(){try{await aset('data',AD)}catch(e){alert('保存できませんでした')}}
async function albumExport(){const imgs={};for(const e of AD.list){const v=await aget('img_'+e.id);if(v)imgs[e.id]=v}return{data:AD,imgs}}
async function albumClear(){const d=await adb();await new Promise(res=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>res()});AD={list:[],tags:DEF_ATAGS.slice(),tagOf:{}};ACache.clear()}
async function albumImport(o){await albumClear();const d=o&&o.data||{};AD={list:Array.isArray(d.list)?d.list:[],tags:Array.isArray(d.tags)?d.tags:DEF_ATAGS.slice(),tagOf:d.tagOf||{}};
  for(const[k,v]of Object.entries(o.imgs||{}))await aset('img_'+k,v);await saveAD()}

function entries(){const hide=set().albumHide||[],out=[];
  for(const r of S.records){if(hide.includes(r.dogId))continue;
    if(r.after)out.push({key:'r:'+r.id+':a',src:r.after,rec:r.id,dogId:r.dogId,date:r.date,kind:'after',memo:memoOf(r)});
    if(r.before)out.push({key:'r:'+r.id+':b',src:r.before,rec:r.id,dogId:r.dogId,date:r.date,kind:'before',memo:memoOf(r)})}
  for(const e of AD.list){if(hide.includes(e.dogId))continue;out.push({key:'u:'+e.id,aid:e.id,dogId:e.dogId,date:e.date||'',kind:'photo',memo:e.memo||''})}
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
const entryOf=k=>entries().find(e=>e.key===k);
const FL=()=>[...Object.keys(FLT),...AD.tags.map(t=>'t:'+t)];
function match(e,f){return f==='all'||(f==='after'&&e.kind==='after')||(f==='before'&&e.kind==='before')||(f==='fav'&&e.rec&&S.favs.some(x=>x.recId===e.rec))||(f.startsWith('t:')&&(AD.tagOf[e.key]||[]).includes(f.slice(2)))}
const shown=()=>entries().filter(e=>(!Z.dog||e.dogId===Z.dog)&&match(e,Z.flt));
const imgAttr=e=>e.aid?`data-aimg="${e.aid}"`:`data-img="${e.src}"`;
async function srcOf(e){if(!e.aid)return getImg(e.src);if(ACache.has(e.aid))return ACache.get(e.aid);const v=await aget('img_'+e.aid);if(v)ACache.set(e.aid,v);return v}
async function ahydrate(){for(const el of qa('img[data-aimg]')){const v=await srcOf({aid:el.dataset.aimg});if(v)el.src=v}}
const _hyd=hydrate;hydrate=async()=>{await _hyd();await ahydrate()};
function aFlt(i){Z.flt=FL()[i]||'all';render()}
function aDog(v){Z.dog=v;render()}
function fltChips(){return FL().map((v,i)=>`<span class="chip ${Z.flt===v?'on':''}" onclick="aFlt(${i})">${esc(FLT[v]||'#'+v.slice(2))}</span>`).join('')}
function dogChips(){const dogs=S.dogs.filter(d=>!(set().albumHide||[]).includes(d.id));if(dogs.length<2)return'';
  return `<div>${[['','🐾 全員'],...dogs.map(d=>[d.id,d.name])].map(([v,l])=>`<span class="chip ${Z.dog===v?'on':''}" onclick="aDog('${v}')">${esc(l)}</span>`).join('')}</div>`}

V.history=()=>{if(!S.dogs.length)return V.home();
  const list=shown();let h='',cur=null;
  for(const e of list){const m=(e.date||'').slice(0,7);if(m!==cur){if(cur!==null)h+='</div>';cur=m;h+=`<div class="sec">${m?m.replace('-','年')+'月':'日付なし'}</div><div class="agrid">`}
    const t=(AD.tagOf[e.key]||[])[0];h+=`<div class="athumb" onclick="aOpen('${e.key}')"><img ${imgAttr(e)}>${t?`<span>#${esc(t)}</span>`:''}</div>`}
  if(cur!==null)h+='</div>';
  return shell('アルバム',`${dogChips()}<div class="row" style="margin-top:10px"><button class="btn sub small" onclick="go('xahist')">トリミング履歴</button><button class="btn sub small" onclick="aAdd()">＋ 写真を追加</button></div>
<button class="btn" style="margin-top:12px" onclick="go('xamake')">クリスマス・お正月・成長アルバムの画像を作る</button>
<div style="margin-top:6px">${fltChips()}<button class="link" style="display:inline;width:auto;padding:8px" onclick="go('xatags')">タグを整理</button></div>
${h||`<p class="muted">${Z.flt==='fav'?'お気に入りの写真がありません。':'写真がありません。'}</p>`}`)};
function aOpen(k){const e=entryOf(k);if(!e)return;if(Z.flt==='fav'&&e.rec){const f=S.favs.find(x=>x.recId===e.rec);if(f)return go('xfav',f.id)}go('xaopen',k)}
async function aAdd(){const f=await pickFile('image/*');if(!f)return;
  try{const data=await toPhoto(f),id=uid();await aset('img_'+id,data);ACache.set(id,data);
    AD.list.push({id,dogId:Z.dog||firstDog(),date:today(),memo:'',created:Date.now()});await saveAD();toast('アルバムに追加しました');render()}
  catch(e){toast('写真を読み込めませんでした')}}

/* 写真の詳細 */
V.xaopen=k=>{const e=entryOf(k);if(!e)return shell('写真','<p class="muted">見つかりません。</p>',{back:1});const tg=AD.tagOf[k]||[];
  const info=e.aid?`<label>ワンちゃん</label><select onchange="aEdit('${k}','dogId',this.value)">${S.dogs.map(d=>`<option value="${d.id}" ${d.id===e.dogId?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
<label>日付</label><input type="date" value="${esc(e.date)}" onchange="aEdit('${k}','date',this.value)"><label>メモ</label><textarea onchange="aEdit('${k}','memo',this.value)">${esc(e.memo)}</textarea>`
    :`<div class="muted">${e.kind==='before'?'ビフォー':'アフター'}・${esc((place(recOf(e.rec)?.placeId)||{}).name||'')}</div>${e.memo?`<div class="pre" style="margin-top:6px">${esc(e.memo)}</div>`:''}<button class="link" onclick="go('rec','${e.rec}')">記録の詳細・編集</button>`;
  return shell(`${dog(e.dogId)?.name||''} ${fmtDate(e.date)}`,`<div class="photo big"><img ${imgAttr(e)}></div><div class="card">${info}</div>
<div class="sec">タグ</div><div class="card">${AD.tags.map((t,i)=>`<span class="chip ${tg.includes(t)?'on':''}" onclick="aTag('${k}',${i})">#${esc(t)}</span>`).join('')}<button class="link" onclick="aNewTag('${k}')">＋ 新しいタグ</button></div>
<button class="btn" onclick="aShare('${k}')">共有・保存</button>${e.aid?`<button class="link danger" onclick="aDel('${k}')">この写真を削除</button>`:''}`,{back:1})};
async function aEdit(k,f,v){const e=AD.list.find(x=>'u:'+x.id===k);if(!e)return;e[f]=v;await saveAD()}
async function aTag(k,i){const t=AD.tags[i];if(!t)return;const a=AD.tagOf[k]=AD.tagOf[k]||[];const j=a.indexOf(t);if(j>=0)a.splice(j,1);else a.push(t);await saveAD();render()}
async function aNewTag(k){let t=prompt('新しいタグ');if(!t)return;t=t.trim().replace(/^[#＃]+/,'');if(!t)return;if(!AD.tags.includes(t))AD.tags.push(t);
  if(k){const a=AD.tagOf[k]=AD.tagOf[k]||[];if(!a.includes(t))a.push(t)}await saveAD();render()}
async function aShare(k){const e=entryOf(k);const s=e&&await srcOf(e);if(!s)return toast('写真を読み込めませんでした');shareFiles([dataToFile(s,'trimming.jpg')])}
async function aDel(k){if(!confirm('この写真を削除しますか？'))return;const id=k.slice(2);AD.list=AD.list.filter(x=>x.id!==id);delete AD.tagOf[k];await aset('img_'+id,undefined);ACache.delete(id);await saveAD();back()}

const seasonal=()=>M.kind==='xmas'||M.kind==='ny';

function defSel(){const p=pool().filter(e=>Z.flt!=='all'||e.kind!=='before');if(seasonal())return p.slice(0,1).map(e=>e.key);
  const a=p.slice().reverse();if(a.length<=9)return a.map(e=>e.key);return Array.from({length:9},(_,i)=>a[Math.round(i*(a.length-1)/8)].key)}
const aName=()=>dog(Z.dog)?.name||(S.dogs.length===1?S.dogs[0].name:'');
function defTitleA(){const n=aName();return M.kind==='xmas'?'Merry Christmas':M.kind==='ny'?'Happy New Year':M.kind==='grow'?`${n}の成長アルバム`:`${M.per==='all'?'':M.per+'年 '}${n}のトリミング`}
function mset(k,v){M[k]=k==='style'?Number(v):v;if(k==='kind'||k==='per')M.sel=[];if(k==='kind'&&!M.edited)M.title='';render()}
function mtog(k){const i=M.sel.indexOf(k);if(i>=0)M.sel.splice(i,1);else if(seasonal())M.sel=[k];else if(M.sel.length<9)M.sel.push(k);else return toast('9枚まで選べます');render()}
V.xamake=()=>{const key=M.kind+'|'+M.per+'|'+Z.dog+'|'+Z.flt;if(M.key!==key){M.key=key;M.sel=[]}if(!M.sel.length)M.sel=defSel();if(!M.title)M.title=defTitleA();
  const sg=(o,cur,k)=>`<div class="seg sm" style="margin-top:6px">${Object.entries(o).map(([v,l])=>`<button class="${v===cur?'on':''}" onclick="mset('${k}','${v}')">${esc(Array.isArray(l)?l[0]:l)}</button>`).join('')}</div>`;
  const pers={all:'すべて'};years().forEach(y=>pers[y]=y+'年');
  return shell('画像を作る',`<div class="card"><div class="xl">種類</div>${sg(KINDS,M.kind,'kind')}<div class="xl">期間</div><select class="xsel" onchange="mset('per',this.value)">${Object.entries(pers).map(([v,l])=>`<option value="${v}" ${v===M.per?'selected':''}>${l}</option>`).join('')}</select>
<div class="xl">形</div>${sg(SHAPES,M.shape,'shape')}${seasonal()?'':`<div class="xl">色</div><div class="sws">${STYLES.map((s,i)=>`<button class="sw ${i===M.style?'on':''}" onclick="mset('style','${i}')"><i style="background:${s.bg}"></i>${esc(s.name)}</button>`).join('')}</div>`}

function cphoto(x,im,X,Y,w,h){x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.fillStyle='#eee';x.fillRect(X,Y,w,h);
  if(im){const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;x.drawImage(im,X+(w-dw)/2,Y+(h-dh)/2,dw,dh)}x.restore()}
function ctext(x,t,X,Y,size,w,col,maxW){if(!t)return;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';let s=size;do{x.font=`${w} ${s}px ${FONT}`;s-=2}while(s>20&&x.measureText(t).width>maxW);x.fillText(t,X,Y)}
let ATOK=0;
async function aDraw(){const cv=$('#acv');if(!cv)return;const tok=++ATOK;const es=M.sel.map(entryOf).filter(Boolean),ims=[];
  for(const e of es){const s=await srcOf(e);ims.push(s?await loadSrc(s).catch(()=>null):null)}if(tok!==ATOK)return;
  const[,W,H]=SHAPES[M.shape];cv.width=W;cv.height=H;const x=cv.getContext('2d'),t=String(M.title||'').trim(),n=aName();
  if(M.kind==='xmas'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1f5c3a');g.addColorStop(1,'#0e3321');x.fillStyle=g;x.fillRect(0,0,W,H);
    const cols=['#ff5b5b','#ffd84d','#6fd3ff','#ffffff'];for(let i=0;i<18;i++){const px=30+i*(W-60)/17,py=60+Math.sin(i*0.9)*22;x.fillStyle=cols[i%4];x.beginPath();x.arc(px,py,11,0,7);x.fill()}
    const top=170,bh=H-top-230,pw=W-160;x.fillStyle='#c0392b';x.fillRect(80-18,top-18,pw+36,bh+36);cphoto(x,ims[0],80,top,pw,bh);
    for(const[hx,hy]of[[90,top+10],[W-90,top+bh-10]]){x.fillStyle='#2e8b57';x.beginPath();x.ellipse(hx-22,hy,26,14,0.5,0,7);x.ellipse(hx+22,hy,26,14,-0.5,0,7);x.fill();x.fillStyle='#e53935';[[-8,-6],[8,-6],[0,8]].forEach(([a,b])=>{x.beginPath();x.arc(hx+a,hy+b,9,0,7);x.fill()})}
    ctext(x,t,W/2,H-140,76,'bold','#fff',W-120);if(n)ctext(x,'from '+n,W/2,H-62,40,'normal','#ffd84d',W-120)}
  else if(M.kind==='ny'){x.fillStyle='#fbf5e6';x.fillRect(0,0,W,H);x.strokeStyle='#c0392b';x.lineWidth=28;x.strokeRect(14,14,W-28,H-28);x.strokeStyle='#c9a227';x.lineWidth=4;x.strokeRect(44,44,W-88,H-88);
    const d=new Date(),yr=d.getMonth()>=9?d.getFullYear()+1:d.getFullYear();ctext(x,String(yr),W/2,120,64,'bold','#c0392b',W-160);
    const top=180,bh=H-top-260;cphoto(x,ims[0],90,top,W-180,bh);
    const plum=(px,py)=>{x.fillStyle='#e8758f';for(let i=0;i<5;i++){const a=i*Math.PI*2/5;x.beginPath();x.arc(px+Math.cos(a)*16,py+Math.sin(a)*16,13,0,7);x.fill()}x.fillStyle='#c9a227';x.beginPath();x.arc(px,py,7,0,7);x.fill()};
    plum(110,top-10);plum(W-110,top+bh+10);
    ctext(x,t,W/2,H-170,68,'bold','#333',W-160);ctext(x,'今年もよろしくお願いします',W/2,H-95,40,'normal','#c0392b',W-160)}
  else{const st=STYLES[M.style]||STYLES[0];x.fillStyle=st.bg;x.fillRect(0,0,W,H);ctext(x,t,W/2,90,64,'bold',st.text,W-80);
    let sub='';if(M.kind==='grow'&&es.length){const ds=es.map(e=>e.date).filter(Boolean).sort();if(ds.length)sub=fmtDate(ds[0])+' → '+fmtDate(ds[ds.length-1])}
    if(M.kind==='year'){const c=S.records.filter(r=>(!Z.dog||r.dogId===Z.dog)&&(M.per==='all'||(r.date||'').startsWith(M.per))).length;sub='トリミング '+c+'回'}
    ctext(x,sub,W/2,160,40,'normal',st.text,W-80);
    const k=ims.length,cols=k<=1?1:k<=4?2:3,rows=Math.max(1,Math.ceil(k/cols)),gap=14,top=210,bot=H-80,cw=(W-80-gap*(cols-1))/cols,ch=(bot-top-gap*(rows-1))/rows;
    ims.forEach((im,i)=>cphoto(x,im,40+(i%cols)*(cw+gap),top+Math.floor(i/cols)*(ch+gap),cw,ch));
    x.globalAlpha=.6;ctext(x,APP_NAME,W/2,H-40,28,'bold',st.text,W);x.globalAlpha=1}}
async function mshare(){const cv=$('#acv');if(!cv)return;await aDraw();const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));if(!b)return toast('画像を作れませんでした');
  const tags={xmas:['#クリスマス','#犬のいる暮らし'],ny:['#お正月','#年賀状','#犬のいる暮らし'],grow:['#成長記録','#犬のいる暮らし'],year:['#1年まとめ','#トリミング']}[M.kind];
  copyText([...tags,APP_TAG].join('\n')).then(ok=>{if(ok)toast('ハッシュタグをコピーしました')});shareFiles([new File([b],'album.jpg',{type:'image/jpeg'})])}
/* 画像を作る（成長アルバム） */
const MAXA=30;
M.kind='grow';
const years=()=>[...new Set(entries().map(e=>(e.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
const pool=()=>entries().filter(e=>(!Z.dog||e.dogId===Z.dog)&&(M.per==='all'||(e.date||'').startsWith(M.per))&&match(e,Z.flt));
function pick(n){const a=pool().filter(e=>Z.flt!=='all'||e.kind!=='before').reverse();if(a.length<=n)return a.map(e=>e.key);
  return Array.from({length:n},(_,i)=>a[Math.round(i*(a.length-1)/(n-1))].key)}
const defSel=()=>pick(12);
const aName=()=>dog(Z.dog)?.name||(S.dogs.length===1?S.dogs[0].name:'');
const defTitleA=()=>{const n=aName();return `${n?n+'の':''}成長アルバム`};
function mset(k,v){M[k]=k==='style'?Number(v):v;if(k==='per'){M.sel=[];M.cleared=false;if(!M.edited)M.title=''}render()}
function mtog(k){const i=M.sel.indexOf(k);if(i>=0)M.sel.splice(i,1);else if(M.sel.length<MAXA)M.sel.push(k);else return toast(MAXA+'枚まで選べます');M.cleared=false;render()}
function mall(){M.sel=pick(MAXA);M.cleared=false;render()}
function mclear(){M.sel=[];M.cleared=true;render()}
V.xamake=()=>{const key=M.per+'|'+Z.dog+'|'+Z.flt;if(M.key!==key){M.key=key;M.sel=[];M.cleared=false}
  if(!M.sel.length&&!M.cleared)M.sel=defSel();if(!M.title&&!M.edited)M.title=defTitleA();if(M.dt==null)M.dt=true;
  const sg=(o,cur,k)=>`<div class="seg sm" style="margin-top:6px">${Object.entries(o).map(([v,l])=>`<button class="${v===cur?'on':''}" onclick="mset('${k}','${v}')">${esc(Array.isArray(l)?l[0]:l)}</button>`).join('')}</div>`;
  const pers={all:'すべて'};years().forEach(y=>pers[y]=y+'年');
  return shell('成長アルバムを作る',`<div class="card"><div class="xl">期間</div><select class="xsel" onchange="mset('per',this.value)">${Object.entries(pers).map(([v,l])=>`<option value="${v}" ${v===M.per?'selected':''}>${l}</option>`).join('')}</select>
<div class="xl">形</div>${sg(SHAPES,M.shape,'shape')}
<div class="xl">色</div><div class="sws">${STYLES.map((s,i)=>`<button class="sw ${i===M.style?'on':''}" onclick="mset('style','${i}')"><i style="background:${s.bg}"></i>${esc(s.name)}</button>`).join('')}</div>
<div class="xl">タイトル（空欄なら出ません）</div><input value="${esc(M.title)}" oninput="M.title=this.value;M.edited=true;aDraw()">
<label class="xck" style="margin-top:14px"><input type="checkbox" ${M.dt?'checked':''} onchange="M.dt=this.checked;aDraw()">写真に日付を入れる</label></div>
<div class="card" style="padding:10px"><canvas id="acv"></canvas><p class="muted" style="text-align:center;margin:8px 0 0">選んだ写真が古い順に並びます（${M.sel.length}枚）</p></div>
<div class="sec">のせる写真（${MAXA}枚まで）</div>${dogChips()}<div>${fltChips()}</div>
<div class="row" style="margin-top:10px"><button class="btn sub small" onclick="mall()">まんべんなく${MAXA}枚選ぶ</button><button class="btn sub small" onclick="mclear()">選択をクリア</button></div>
<div class="agrid" style="margin-top:8px">${pool().map(e=>`<div class="athumb ${M.sel.includes(e.key)?'on':''}" onclick="mtog('${e.key}')"><img ${imgAttr(e)}></div>`).join('')||'<p class="muted">写真がありません</p>'}</div>`,{back:1,bar:'<button class="btn" onclick="mshare()">画像を共有・保存</button>'})};
AFTER.xamake=()=>aDraw();
function cphoto(x,im,X,Y,w,h){x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.fillStyle='#eee';x.fillRect(X,Y,w,h);
  if(im){const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;x.drawImage(im,X+(w-dw)/2,Y+(h-dh)/2,dw,dh)}x.restore()}
function ctext(x,t,X,Y,size,w,col,maxW){if(!t)return;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';let s=size;do{x.font=`${w} ${s}px ${FONT}`;s-=2}while(s>20&&x.measureText(t).width>maxW);x.fillText(t,X,Y)}
let ATOK=0;
async function aDraw(){const cv=$('#acv');if(!cv)return;const tok=++ATOK;
  const es=M.sel.map(entryOf).filter(Boolean).sort((a,b)=>(a.date||'').localeCompare(b.date||'')),ims=[];
  for(const e of es){const s=await srcOf(e);ims.push(s?await loadSrc(s).catch(()=>null):null);if(tok!==ATOK)return}
  const[,W,H]=SHAPES[M.shape];cv.width=W;cv.height=H;const x=cv.getContext('2d'),t=String(M.title||'').trim(),st=STYLES[M.style]||STYLES[0];
  x.fillStyle=st.bg;x.fillRect(0,0,W,H);let top=50;
  if(t){ctext(x,t,W/2,top+40,64,'bold',st.text,W-80);top+=90}
  const ds=es.map(e=>e.date).filter(Boolean);
  if(ds.length){const sub=(ds[0]!==ds[ds.length-1]?fmtDate(ds[0])+' → '+fmtDate(ds[ds.length-1]):fmtDate(ds[0]))+'　'+es.length+'枚';ctext(x,sub,W/2,top+22,36,'normal',st.text,W-80);top+=60}
  top+=10;const k=ims.length,gap=k>12?8:14,L=40,bot=H-80,aw=W-80,ah=bot-top;
  let best={c:1,s:0};for(let c=1;c<=8;c++){const r=Math.ceil(Math.max(k,1)/c),cw=(aw-gap*(c-1))/c,ch=(ah-gap*(r-1))/r,s=Math.min(cw,ch);if(s>best.s)best={c,s}}
  const cols=best.c,rows=Math.max(1,Math.ceil(k/cols)),cw=(aw-gap*(cols-1))/cols,ch=(ah-gap*(rows-1))/rows;
  ims.forEach((im,i)=>{const r=Math.floor(i/cols),inRow=Math.min(cols,k-r*cols);let X=L+(i%cols)*(cw+gap);if(inRow<cols)X+=(cols-inRow)*(cw+gap)/2;const Y=top+r*(ch+gap);
    cphoto(x,im,X,Y,cw,ch);
    if(M.dt&&es[i].date){const fs=Math.max(18,Math.min(32,cw/7)),tx=fmtDate(es[i].date);x.font=`bold ${fs}px ${FONT}`;const tw=Math.min(x.measureText(tx).width+fs,cw);
      x.fillStyle='rgba(0,0,0,.55)';x.fillRect(X,Y+ch-fs*1.5,tw,fs*1.5);x.fillStyle='#fff';x.textAlign='left';x.textBaseline='middle';x.fillText(tx,X+fs/2,Y+ch-fs*0.75,cw-fs)}});
  if(!k)ctext(x,'下から写真を選んでください',W/2,(top+bot)/2,40,'normal',st.text,W-80);
  x.globalAlpha=.6;ctext(x,APP_NAME,W/2,H-40,28,'bold',st.text,W);x.globalAlpha=1}
async function mshare(){const cv=$('#acv');if(!cv)return;await aDraw();const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));if(!b)return toast('画像を作れませんでした');
  copyText(['#成長記録','#犬のいる暮らし',APP_TAG].join('\n')).then(ok=>{if(ok)toast('ハッシュタグをコピーしました')});shareFiles([new File([b],'album.jpg',{type:'image/jpeg'})])}
/* ===== お気に入り ===== */
const FF={img:'お気に入りの写真',before:'ビフォーの写真',memo:'お願いした内容',dog:'ワンちゃん',shop:'お店',staff:'担当者',menu:'やったこと',date:'来店日',price:'金額',score:'点数',cond:'体調'};
const FDEF=['img','memo','shop','staff','date'];
const favShow=()=>{const s=set();if(!Array.isArray(s.favShow))s.favShow=FDEF.slice();return s.favShow};
V.xfav=id=>{const f=favOf(id);if(!f)return shell('お気に入り','<p class="muted">見つかりません。</p>',{back:1});
  const r=recOf(f.recId),sh=favShow(),it=(l,v)=>v?`<div class="muted" style="margin-top:10px">${l}</div><div class="pre">${v}</div>`:'';
  const val={memo:esc(f.memo||(r?memoOf(r):'')),dog:esc(dog(f.dogId)?.name||''),shop:r?esc((place(r.placeId)||{}).name||''):'',staff:esc(f.staff||r?.staff||''),
    menu:esc((f.menus&&f.menus.length?f.menus:r?.menus||[]).join('・')),date:r?esc(visitStr(r)):'',price:r?yen(r.price):'',score:r&&r.score?starHtml(r.score):'',cond:r?esc([r.cond,r.condNote].filter(Boolean).join('　')):''};
  let h='';for(const k of Object.keys(FF)){if(!sh.includes(k))continue;
    if(k==='img')h+=f.img?`<div class="photo big"><img data-img="${f.img}"></div>`:'';
    else if(k==='before')h+=r&&r.before?`<div class="muted" style="margin-top:12px">ビフォー</div><div class="photo big" style="width:55%"><img data-img="${r.before}"></div>`:'';
    else if(k==='memo')h+=`<div class="card"><div class="muted">お願いした内容</div><div class="xmemo" style="margin-top:6px">${val.memo||'メモはありません'}</div></div>`;
    else h+=it(FF[k],val[k])}
  return shell(f.name,`${h}<div class="row" style="margin-top:16px"><button class="btn sub small" onclick="xFavName('${id}')">名前を変える</button><button class="btn sub small" onclick="xFavMemo('${id}')">メモを編集</button></div>
${f.img?`<button class="btn" onclick="xShowShare('${f.img}')">画像を共有・保存</button>`:''}${r?`<button class="btn sub" onclick="go('rec','${r.id}')">記録を開く</button>`:''}<button class="link danger" onclick="xFavDel('${id}')">お気に入りから外す</button>`,{back:1})};
async function xFavName(id){const f=favOf(id);const n=prompt('新しい名前',f.name);if(!n)return;f.name=n.trim();await save();render()}
async function xFavMemo(id){const f=favOf(id);const n=prompt('お願いした内容',f.memo||'');if(n===null)return;f.memo=n;await save();render()}
async function xFavDel(id){if(!confirm('お気に入りから外しますか？（元の記録は消えません）'))return;const f=favOf(id);if(f.img)await delImg(f.img);S.favs=S.favs.filter(x=>x.id!==id);await save();back()}
V.xfavset=()=>{const sh=favShow();return shell('お気に入りに表示する項目',`<p class="muted">押すとオン・オフが切り替わります。</p><div class="card">${Object.entries(FF).map(([k,l])=>`<span class="chip ${sh.includes(k)?'on':''}" onclick="xFavTog('${k}')">${l}</span>`).join('')}</div>`,{back:1})};
async function xFavTog(k){const s=favShow(),i=s.indexOf(k);if(i>=0)s.splice(i,1);else s.push(k);await save();render()}

/* ===== データの形をそろえる ===== */
function fixS(){for(const k of['dogs','places','records','favs','resv'])if(!Array.isArray(S[k]))S[k]=[];
  if(!S.settings||typeof S.settings!=='object')S.settings={};const s=S.settings;
  if(!Array.isArray(s.defRem))s.defRem=clone(DEF_REM);if(!Array.isArray(s.phrases))s.phrases=[];if(!s.postDef)s.postDef={tpl:'simple',style:0,label:true};
  S.dogs.forEach(d=>{if(d.interval==null)d.interval=DEF_IV;if(!d.rTime)d.rTime=DEF_RT});
  if(!S.places.some(p=>p.id==='home'))S.places.unshift({id:'home',name:'自宅',tags:['#おうちトリミング','#セルフトリミング']});
  S.places.forEach(p=>p.tags=tagsOf(p));
  S.records.forEach(r=>{if(r.created==null)r.created=0;if(!r.date)r.date=today();
    if(r.nextAt){if(!S.resv.some(x=>x.fromRec===r.id))S.resv.push({id:uid(),dogId:r.dogId,placeId:r.placeId,at:r.nextAt,menu:r.nextMenu||'',rem:validRems(r.rem),fromRec:r.id})}
    delete r.nextAt;delete r.nextMenu;delete r.rem})}

/* ===== ホーム画面のアイコン ===== */
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#e8758f';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.beginPath();x.ellipse(90,112,34,28,0,0,7);x.fill();
  [[-38,-14],[-14,-40],[14,-40],[38,-14]].forEach(([dx,dy])=>{x.beginPath();x.ellipse(90+dx,90+dy,12,16,dx/80,0,7);x.fill()});
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)})();

/* ===== 起動 ===== */
(async()=>{try{await openDB();const v=await dbGet('state');if(v)S=v;fixS();await save();
  try{await aload()}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  render()}catch(e){document.body.innerHTML='<p style="padding:20px">データを読み込めませんでした。Safariを開き直してください。</p>'}})();
</script>
