<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トリミングログ">
<meta name="theme-color" content="#ffffff">
<title>トリミングログ</title>
<style>
:root{--main:#e8758f;--bg:#fff7f8;--text:#333;--sub:#888;--line:#f3e3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#fff;border-bottom:1px solid #f0d5db;position:sticky;top:0;z-index:5;min-height:52px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:16px 16px 40px;max-width:600px;margin:0 auto}
main.pb{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;margin:8px 0}
a.btn{text-align:center;text-decoration:none}
.btn.sub{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.danger{background:#fff;color:#d33;border:2px solid #d33}
.btn.big{padding:18px;font-size:18px;margin:12px 0}
.btn.small{padding:11px;font-size:14px;margin:0}
.link{display:block;width:100%;background:none;border:none;color:var(--main);font-size:15px;font-weight:bold;padding:12px 0 2px;text-align:center}
.link.danger{color:#d33;margin-top:16px}
.back{background:none;border:none;font-size:16px;color:var(--main);padding:0;flex:none}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card>label:first-child{margin-top:0}
.card.alert{border:2px solid var(--main)}
.sec{font-size:16px;font-weight:bold;margin:26px 0 8px;padding-left:10px;border-left:5px solid var(--main)}
main>.sec:first-child{margin-top:4px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
label.chk input{width:22px;height:22px;flex:none;margin:0}
.req{color:#d33;font-weight:bold;font-size:12px;margin-left:4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;background:#fff;font-family:inherit;color:var(--text)}
textarea{min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.photo{aspect-ratio:3/4;background:#f3e3e6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;font-size:13px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.big{background:#f7f7f7}
.photo.big img{object-fit:contain}
.count{font-size:36px;font-weight:bold;color:var(--main);line-height:1.2}
.muted{color:var(--sub);font-size:13px}
.pre{white-space:pre-wrap}
.tag{display:inline-block;padding:6px 12px;margin:4px;border-radius:20px;border:1px solid var(--main);color:var(--main);font-size:14px}
.tag.off{border-color:#ccc;color:#bbb;text-decoration:line-through}
.chip{display:inline-block;padding:8px 12px;margin:4px 4px 0 0;border-radius:20px;border:1px solid #ddd;color:#888;font-size:14px;background:#fff}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.chip.mine{border-color:var(--main);color:var(--main)}
.list-item{display:flex;align-items:center;gap:12px}
.list-item .photo{width:56px;flex:none;border-radius:8px}
.minicall{flex:none;padding:8px 12px;border:2px solid var(--main);border-radius:10px;color:var(--main);background:#fff;font-weight:bold;text-decoration:none;font-size:13px}
.mrow{display:flex;align-items:center;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gitem{background:#fff;border-radius:14px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:14px}
.gitem .photo{margin-bottom:6px;border-radius:10px}
.stars{display:flex;gap:6px}
.stars button{flex:none;width:44px;height:44px;border:none;background:none;font-size:34px;color:#ddd;padding:0;line-height:1}
.stars button.on{color:#f5b301}
.star{color:#f5b301;letter-spacing:1px}
.star0{color:#ddd;letter-spacing:1px}
.rank{flex:none;width:30px;font-size:22px;font-weight:bold;color:var(--main);text-align:center}
.order{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
.order h2{margin:14px 0 2px;font-size:24px}
.order .memo{font-size:26px;line-height:1.6;white-space:pre-wrap;font-weight:bold;margin-top:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #f0d5db;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabbar button{flex:1;border:none;background:none;padding:16px 0 14px;font-size:14px;font-weight:bold;color:#aaa;border-top:3px solid transparent}
.tabbar button.on{color:var(--main);border-top-color:var(--main)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0d5db;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.savebar .btn{margin:0 auto;max-width:568px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:50;max-width:90%;text-align:center}
#cmp{display:block;margin:12px auto 4px;width:auto;height:auto;max-width:100%;max-height:58vh;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.15);touch-action:none;-webkit-user-select:none;user-select:none}
.remrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.remrow select{flex:1.2}.remrow input{flex:1}
.remrow button{flex:none;width:44px;height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#d33;font-size:18px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:14px;font-weight:bold}
.seg button.on{background:var(--main);color:#fff}
.seg.sm button{font-size:13px;padding:10px 2px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{flex:none;width:50px;text-align:center;font-size:11px;color:var(--sub);background:none;border:none;padding:0}
.sw i{display:block;width:40px;height:40px;margin:0 auto 3px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}
.sw.on{color:var(--main);font-weight:bold}
.sw.on i{box-shadow:0 0 0 3px var(--main)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_NAME='トリミングログ';
const APP_TAG='#トリミングログ';
const DAYS=[0,1,2,3,5,7,10,14,21,30];
const DEF_REM=[{d:1,t:'20:00'},{d:0,t:'09:00'}];
const IVS=[0,14,21,28,30,40,45,60,90];
const DEF_IV=30,DEF_RT='10:00';
const MENUS=['カット','シャンプー','部分カット','爪切り','耳そうじ','肛門腺しぼり','歯みがき','パック・スパ'];
const CONDS=['元気','いつも通り','少し元気がない','体調が悪い'];
const STYLES=[
  {name:'ピンク',bg:'#fff7f8',text:'#e8758f',label:'#e8758f',labelText:'#fff'},
  {name:'ダーク',bg:'#2b2b2b',text:'#fff',label:'#f7c948',labelText:'#2b2b2b'},
  {name:'ミント',bg:'#f0faf6',text:'#3a9e7e',label:'#5cbf9b',labelText:'#fff'},
  {name:'ベージュ',bg:'#f7f1e8',text:'#8a6a4a',label:'#b08860',labelText:'#fff'},
  {name:'スカイ',bg:'#f0f6ff',text:'#4a7fc1',label:'#6a9fe0',labelText:'#fff'},
  {name:'モノクロ',bg:'#ffffff',text:'#222',label:'#222',labelText:'#fff'}];
const TPLS={simple:'シンプル',polaroid:'ポラロイド',magazine:'雑誌風',frame:'フレーム'};
const DEF_PHRASES=['さっぱりしました','今月もかわいくしてもらいました','シャンプーでふわふわ','夏仕様のショートカット','お気に入りのカット'];
const SIZES={post:'投稿用（縦4:5）',story:'ストーリー・リール用'};
const MODES={both:'ビフォー＋アフター',after:'アフターだけ'};
const FONT='-apple-system,"Hiragino Sans",sans-serif';
const WD='日月火水木金土';
const TABS=[['home','ホーム'],['history','記録'],['ranking','ランキング'],['settings','設定']];
const TAB_IDS=TABS.map(t=>t[0]);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const nowTime=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const fmtDate=s=>s?s.replace(/-/g,'/'):'';
const visitStr=r=>fmtDate(r.date)+(r.time?' '+r.time:'');
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
const daysTo=s=>{const n=new Date(s),t=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)};
const yen=p=>p?'¥'+Number(p).toLocaleString():'';
const dayLabel=d=>d===0?'当日':d+'日前';
const validRems=list=>(Array.isArray(list)?list:[]).filter(o=>o&&typeof o==='object'&&typeof o.d==='number');
const remText=list=>validRems(list).map(x=>dayLabel(x.d)+'の'+x.t).join('、')||'なし';
const memoOf=r=>r.memo??r.order??r.note??'';
const starHtml=n=>n?`<span class="star">${'★'.repeat(n)}</span><span class="star0">${'★'.repeat(5-n)}</span>`:'';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

/* ---- 保存（IndexedDB） ---- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('trimlog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbGet(k){return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbSet(k,v){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDel(k){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbClear(){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

let S={dogs:[],places:[],records:[],favs:[],resv:[],settings:{defRem:clone(DEF_REM)}};
const imgCache=new Map();
const save=()=>dbSet('state',S);
async function putImg(data){const id='img_'+uid();await dbSet(id,data);imgCache.set(id,data);return id}
async function getImg(id){if(!id)return null;if(imgCache.has(id))return imgCache.get(id);const v=await dbGet(id);if(v)imgCache.set(id,v);return v}
async function delImg(id){if(id){await dbDel(id);imgCache.delete(id)}}
async function hydrate(){for(const el of document.querySelectorAll('img[data-img]')){const v=await getImg(el.dataset.img);if(v)el.src=v}}

const dog=id=>S.dogs.find(d=>d.id===id);
const activeDogs=()=>S.dogs.filter(d=>!d.hidden);
const dogLabel=d=>esc(d.name)+(d.hidden?'（非表示）':'');
const place=id=>S.places.find(p=>p.id===id)||S.places[0];
const recOf=id=>S.records.find(r=>r.id===id);
const favOf=id=>S.favs.find(f=>f.id===id);
const resOf=id=>S.resv.find(x=>x.id===id);
const linkedRes=recId=>S.resv.find(x=>x.fromRec===recId);
const byNew=(a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||'')||b.created-a.created;
const recsOf=dogId=>S.records.filter(r=>r.dogId===dogId).sort(byNew);
const cover=r=>r.after||r.before;
const normTags=s=>[...new Set(String(s).split(/[\s,、　]+/).filter(Boolean).map(t=>'#'+t.replace(/^[#＃]+/,'')).filter(t=>t.length>1))].slice(0,5);
const tagsOf=p=>!p?[]:Array.isArray(p.tags)?p.tags:normTags(p.tags||'');
const shopTag=p=>!p||p.id==='home'?null:'#'+String(p.name||'').replace(/[\s　#＃]+/g,'');
const placeOpts=cur=>S.places.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('');

/* ---- お店の情報 ---- */
const telHref=t=>'tel:'+String(t||'').replace(/[^\d+]/g,'');
function placeBtns(p){if(!p||p.id==='home')return'';
  return `${p.hours?`<div class="muted pre" style="margin-top:8px">営業時間・定休日：${esc(p.hours)}</div>`:''}${p.tel?`<a class="btn sub" href="${telHref(p.tel)}">電話する（${esc(p.tel)}）</a>`:''}`}

/* ---- ランキング ---- */
function rankCuts(dg){return S.records.filter(r=>r.score>0&&(!dg||r.dogId===dg)).sort((a,b)=>b.score-a.score||byNew(a,b))}
function rankShops(dg){const m={};for(const r of S.records){if(!(r.score>0)||(dg&&r.dogId!==dg))continue;(m[r.placeId]=m[r.placeId]||[]).push(r.score)}
  return Object.entries(m).filter(([id])=>S.places.some(p=>p.id===id)).map(([id,a])=>({p:place(id),avg:a.reduce((s,v)=>s+v,0)/a.length,n:a.length})).sort((a,b)=>b.avg-a.avg||b.n-a.n)}
function withRank(list,val){let prev=null,rk=0;return list.map((x,i)=>{const v=val(x);if(v!==prev){rk=i+1;prev=v}return{x,rk}})}
const cutCard=(r,rk)=>`<div class="card list-item" onclick="go('rec','${r.id}')"><div class="rank">${rk}</div><div class="photo">${cover(r)?`<img data-img="${cover(r)}">`:''}</div><div style="flex:1">${starHtml(r.score)}<div><b>${esc(dog(r.dogId)?.name||'')}</b>　${fmtDate(r.date)}</div><div class="muted">${esc(place(r.placeId).name)}</div></div><span class="muted">›</span></div>`;
const shopCard=(o,rk)=>`<div class="card list-item"><div class="rank">${rk}</div><div style="flex:1"><b>${esc(o.p.name)}</b><div><span class="star">★</span> ${o.avg.toFixed(1)}　<span class="muted">${o.n}回</span></div></div>${o.p.tel&&o.p.id!=='home'?`<a class="minicall" href="${telHref(o.p.tel)}">電話</a>`:''}</div>`;
const dogFilter=(cur,on)=>S.dogs.length>1?`<select onchange="${on}" style="margin-top:10px"><option value="">すべてのワンちゃん</option>${S.dogs.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${dogLabel(d)}</option>`).join('')}</select>`:'';

/* ---- 写真（アプリの中にコピーして保存） ---- */
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadSrc(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function toPhoto(file){
  const url=URL.createObjectURL(file);
  try{const im=await loadSrc(url);const r=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}
  finally{URL.revokeObjectURL(url)}
}

/* ---- 画面の切り替え ---- */
const V={},AFTER={};
let view='home',param=null,stack=[],wl=null,JUST=null;
function relWL(){if(wl){wl.release().catch(()=>{});wl=null}}
function go(v,p,o){if(view==='order'&&v!=='order')relWL();
  if(TAB_IDS.includes(v)){stack=[];JUST=null}else if(!(o&&o.replace))stack.push([view,param,window.scrollY]);
  view=v;param=p;render();window.scrollTo(0,0)}
function back(){if(view==='order')relWL();const b=stack.pop()||['home',null,0];view=b[0];param=b[1];render();window.scrollTo(0,b[2]||0)}
function render(){$('#app').innerHTML=V[view](param);hydrate();if(AFTER[view])AFTER[view](param)}
function shell(title,body,o){o=o||{};const tab=TAB_IDS.includes(view);const b=o.back===1||o.back===true?'back()':o.back;
  return `<header>${b?`<button class="back" onclick="${b}">‹ 戻る</button>`:''}<h1>${esc(title)}</h1></header><main class="${tab||o.bar?'pb':''}">${body}</main>${o.bar?`<div class="savebar">${o.bar}</div>`:''}${tab?`<nav class="tabbar">${TABS.map(([v,l])=>`<button class="${v===view?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}</nav>`:''}`}
const installHint=()=>navigator.standalone?'':`<div class="card muted">Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように使えて、データも消えにくくなります。</div>`;
function dogField(id,cur){let list=activeDogs();const c=dog(cur);if(c&&c.hidden)list=[...list,c];if(!list.length)list=S.dogs.slice(0,1);
  return list.length===1?`<input type="hidden" id="${id}" value="${list[0].id}">`:`<label>ワンちゃん</label><select id="${id}">${list.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${dogLabel(d)}</option>`).join('')}</select>`}
const firstDog=()=>(activeDogs()[0]||S.dogs[0]).id;

/* ---- 通知の編集 ---- */
const remEditor=list=>`<div>${list.map((r,i)=>`<div class="remrow"><select class="rem_d">${DAYS.map(d=>`<option value="${d}" ${d===r.d?'selected':''}>${dayLabel(d)}</option>`).join('')}</select><input type="time" class="rem_t" value="${esc(r.t)}"><button onclick="delRem(${i})">✕</button></div>`).join('')||'<p class="muted">通知なし</p>'}</div><button class="link" onclick="addRem()">＋ 通知を追加</button>`;
function readRems(){return [...document.querySelectorAll('.remrow')].map(el=>({d:Number(el.querySelector('.rem_d').value),t:el.querySelector('.rem_t').value||'09:00'}))}
let RD=null,D=null,R=null;
function remList(){if(view==='recEdit'){syncD();return D.rem}if(view==='resEdit'){syncR();return R.rem}RD=readRems();return RD}
function addRem(){remList().push({d:0,t:'09:00'});render()}
function delRem(i){remList().splice(i,1);render()}

/* ---- 予約一覧・そろそろ予約 ---- */
function upcoming(){const now=new Date();
  return S.resv.filter(x=>x.at&&new Date(x.at)>now&&!dog(x.dogId)?.hidden).sort((x,y)=>x.at.localeCompare(y.at))}
function dueDate(d,r){const t=new Date(r.date+'T00:00');t.setDate(t.getDate()+Number(d.interval));const[h,m]=String(d.rTime||DEF_RT).split(':').map(Number);t.setHours(h||0,m||0,0,0);return t}
function dueOf(d,ups){if(d.hidden||!(Number(d.interval)>0))return null;if(ups.some(u=>u.dogId===d.id))return null;
  const r=recsOf(d.id)[0];if(!r)return null;const due=dueDate(d,r);return daysTo(due)<=0?{r,due}:null}
const resRow=(x,first)=>{const p=place(x.placeId);
  return `<div class="list-item" style="padding:12px 0;${first?'':'border-top:1px solid var(--line)'}" onclick="editRes('${x.id}')"><div style="flex:1"><b>${fmtDT(x.at)}</b><div class="muted">${esc(dog(x.dogId)?.name)}・${esc(p.name)}</div>${x.menu?`<div class="muted">${esc(x.menu)}</div>`:''}</div>${p.tel&&p.id!=='home'?`<a class="minicall" href="${telHref(p.tel)}" onclick="event.stopPropagation()">電話</a>`:''}<span class="muted">›</span></div>`};

/* ===== ホーム ===== */
V.home=()=>{
  if(!S.dogs.length)return shell(APP_NAME,`<div class="card"><p>まずはワンちゃんを登録しましょう。</p><button class="btn" onclick="go('dogEdit')">ワンちゃんを登録する</button></div>${installHint()}`);
  const ups=upcoming(),ad=activeDogs();

<button class="btn big" onclick="newRec()">今回のトリミングを記録する</button>

${id?`<div class="sec">表示</div><div class="card"><label class="chk"><input type="checkbox" id="f_hide" ${d.hidden?'checked':''}>ホームや選択肢に表示しない</label><p class="muted" style="margin-bottom:0">記録と写真は消えません。「記録」タブで見返せます。あとから戻すこともできます。</p></div>
<button class="link danger" onclick="delDog('${id}')">このワンちゃんと記録をすべて削除</button>`:''}`,{back:1,bar:`<button class="btn" onclick="saveDog('${id||''}')">保存する</button>`})};

let BK=null;
V.backup=()=>shell('バックアップ',`<p class="muted">データと写真はこのアプリの中に保存されています。iPhoneの写真アプリから消しても残りますが、ホーム画面のアイコンを削除すると消えます。ときどきバックアップを取っておくと安心です。</p>
${BK?`<button class="btn" onclick="shareBK()">バックアップファイルを保存する</button>`:`<button class="btn" onclick="makeBK()">バックアップを作る</button>`}
<button class="btn sub" onclick="restoreBK()">バックアップから戻す</button>`,{back:1});
async function makeBK(){const ids=new Set();S.records.forEach(r=>{if(r.before)ids.add(r.before);if(r.after)ids.add(r.after)});S.favs.forEach(f=>{if(f.img)ids.add(f.img)});
  const imgs={};for(const id of ids){const v=await getImg(id);if(v)imgs[id]=v}
  BK=new File([JSON.stringify({v:1,S,imgs})],`trimlog-backup-${today()}.json`,{type:'application/json'});render();toast('準備できました。「保存する」を押してください')}
function shareBK(){if(!BK)return;if(navigator.canShare&&navigator.canShare({files:[BK]}))navigator.share({files:[BK]}).catch(()=>{});

async function setPhoto(k){syncD();const f=await pickFile('image/*');if(!f)return;
  try{const id=await putImg(await toPhoto(f));D._imgs.push(id);D[k]=id;if(D.crop)for(const s in D.crop)if(D.crop[s])delete D.crop[s][k[0]];render()}
  catch(e){toast('写真を読み込めませんでした')}}
async function saveRec(){syncD();
  if(!D.placeId)return toast('お店・場所を選んでください');
  if(!D.date)return toast('来店日を入れてください');
  if(!D.time)return toast('来店の時間を入れてください');
  const old=recOf(D.id);
  for(const id of D._imgs)if(id!==D.before&&id!==D.after)await delImg(id);
  if(old)for(const k of['before','after'])if(old[k]&&old[k]!==D[k])await delImg(old[k]);
  const lk=linkedRes(D.id);
  if(D.nextAt){const x={id:lk?.id||uid(),dogId:D.dogId,placeId:D.nplace||D.placeId,at:D.nextAt,menu:D.nextMenu,rem:D.rem,fromRec:D.id};if(lk)Object.assign(lk,x);else S.resv.push(x)}
  else if(lk)S.resv=S.resv.filter(x=>x!==lk);
  const r={...D};['_new','_imgs','nextAt','nextMenu','nplace','rem'].forEach(k=>delete r[k]);
  const isNew=!old;if(old)Object.assign(old,r);else S.records.push(r);
  await save();const id=D.id;D=null;
  if(isNew){JUST=id;go('rec',id,{replace:true})}else{toast('保存しました');back()}}
async function cancelRec(){for(const id of D._imgs)await delImg(id);D=null;back()}

  const it=(l,v)=>v?`<div class="muted" style="margin-top:10px">${l}</div><div class="pre">${v}</div>`:'';
  const photos=r.before?`<div class="row">${ph('before','ビフォー')}${ph('after','アフター')}</div>`:(r.after?`<div class="photo" style="max-width:320px;margin:0 auto"><img data-img="${r.after}"></div>`:'');
  const hasUp=upcoming().some(u=>u.dogId===r.dogId);
  const canRemind=!hasUp&&dd&&!dd.hidden&&Number(dd.interval)>0&&recsOf(r.dogId)[0]?.id===r.id;
  const hasPhoto=!!cover(r);
  const done=JUST===id?`<div class="card alert"><b style="font-size:18px">記録しました</b>
${hasPhoto?`<p class="muted" style="margin:6px 0 0">このままインスタに投稿できます。</p><button class="btn big" onclick="openCompare('${r.id}')">インスタに投稿する</button>`:'<p class="muted" style="margin:6px 0 0">写真を入れると、インスタ用の画像が作れます。</p>'}
${lk&&new Date(lk.at)>new Date()?`<button class="btn sub" onclick="calRes('${lk.id}')">次回の予約をカレンダーに追加</button>`:''}
<button class="link" onclick="go('home')">ホームに戻る</button></div>`:'';
  return shell(`${dd?.name||''} ${fmtDate(r.date)}`,`${done}${photos}
<div class="card"><b style="font-size:17px">${esc(pl.name)}</b>${r.score?`<div>${starHtml(r.score)}</div>`:''}
${it('来店日時',esc(visitStr(r)))}
${it('やったこと',esc((r.menus||[]).join('・')))}
${it('オーダー内容・メモ',esc(memoOf(r)))}
${it('金額',yen(r.price))}
${it('担当者',esc(r.staff))}
${it('体調',esc([r.cond,r.condNote].filter(Boolean).join('　')))}
${placeBtns(pl)}</div>
${JUST===id?'':`${hasPhoto?`<button class="btn" onclick="openCompare('${r.id}')">インスタに投稿する</button>`:''}`}
<button class="btn sub" onclick="go('order',{t:'r',id:'${r.id}'})">このカットをお店で見せる</button>
${canRemind?`<button class="btn sub" onclick="remindCal('${r.id}')">「そろそろ予約」をカレンダーに追加（${fmtMD(dueDate(dd,r))}）</button>`:''}
<div class="row" style="margin-top:8px"><button class="btn sub small" onclick="addFav('${r.id}')">★ お気に入りに登録</button><button class="btn sub small" onclick="editRec('${r.id}')">編集する</button></div>
<button class="link danger" onclick="delRec('${r.id}')">この記録を削除</button>`,{back:JUST===id?"JUST=null;go('home')":1})};
async function delRec(id){if(!confirm('この記録を削除しますか？（入れた予約は残ります）'))return;const r=recOf(id);await delImg(r.before);await delImg(r.after);
  S.resv.forEach(x=>{if(x.fromRec===id)delete x.fromRec});S.records=S.records.filter(x=>x.id!==id);await save();JUST=null;back()}

  const name=prompt('お気に入りの名前をつけてください',`${dog(r.dogId)?.name||''} ${fmtDate(r.date)}のカット`);if(!name)return;

  S.favs.push({id:uid(),name:name.trim(),dogId:r.dogId,memo:memoOf(r),menus:[...(r.menus||[])],staff:r.staff||'',img});

/* ===== 投稿画像 ===== */
let CMP=null,RAF=0;const IMGS={};
function postOf(r){if(!r.post||typeof r.post!=='object')r.post={};const p=r.post,d=S.settings.postDef||{};
  if(!TPLS[p.tpl])p.tpl=TPLS[d.tpl]?d.tpl:'simple';
  if(!STYLES[p.style])p.style=STYLES[d.style]?d.style:0;
  if(typeof p.label!=='boolean')p.label=d.label!==false;
  if(p.sub==null)p.sub='';if(p.lb==null)p.lb='BEFORE';if(p.la==null)p.la='AFTER';return p}
const defTitle=r=>`${dog(r.dogId)?.name||''}　${fmtDate(r.date)}`;
const titleOf=r=>{const p=postOf(r);return p.title!=null?p.title:defTitle(r)};
function openCompare(id){const r=recOf(id);CMP={id,size:'post',mode:r&&r.before&&r.after?'both':'after',off:[]};go('compare',id)}
const cmpSize=()=>CMP.size==='story'?[1080,1920]:[1080,1350];
function area(){const r=recOf(CMP.id),P=postOf(r),[W,H]=cmpSize(),sub=!!String(P.sub).trim();
  switch(P.tpl){
    case 'polaroid':{const tb=sub?290:230;return{x:74,y:84,w:W-148,h:H-84-tb,gap:84}}
    case 'magazine':return{x:0,y:0,w:W,h:H,gap:8};
    case 'frame':{const top=sub?200:160;return{x:84,y:top+24,w:W-168,h:H-top-158,gap:24,top}}
    default:{const top=sub?220:150;return{x:40,y:top,w:W-80,h:H-top-90,gap:40}}}}
function slots(){const r=recOf(CMP.id),P=postOf(r),a=area();const lab=k=>P.label?(k==='b'?P.lb:P.la):'';
  if(CMP.mode==='both'&&r.before&&r.after){
    if(CMP.size==='post'){const w=(a.w-a.gap)/2;return[{k:'b',id:r.before,l:lab('b'),x:a.x,y:a.y,w,h:a.h},{k:'a',id:r.after,l:lab('a'),x:a.x+w+a.gap,y:a.y,w,h:a.h}]}
    const h=(a.h-a.gap)/2;return[{k:'b',id:r.before,l:lab('b'),x:a.x,y:a.y,w:a.w,h},{k:'a',id:r.after,l:lab('a'),x:a.x,y:a.y+h+a.gap,w:a.w,h}]}
  return[{k:'o',id:r.after||r.before,l:r.after?lab('a'):'',x:a.x,y:a.y,w:a.w,h:a.h}]}
function cropOf(k){const r=recOf(CMP.id);if(!r.crop||typeof r.crop!=='object')r.crop={};const c=r.crop[CMP.size]=r.crop[CMP.size]||{};
  let v=c[k];if(!v||!isFinite(v.z)||!isFinite(v.x)||!isFinite(v.y)||v.z<1)v=c[k]={z:1,x:0,y:0};return v}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function fitFont(x,t,maxW,size,weight){let s=size;x.font=`${weight} ${s}px ${FONT}`;while(s>20&&x.measureText(t).width>maxW){s-=2;x.font=`${weight} ${s}px ${FONT}`}}
function txt(x,t,X,Y,size,weight,color,maxW,align){if(!t)return;x.textAlign=align||'center';x.textBaseline='middle';x.fillStyle=color;fitFont(x,t,maxW,size,weight);x.fillText(t,X,Y)}
function drawPhoto(x,s,rad){x.save();if(rad)rr(x,s.x,s.y,s.w,s.h,rad);else{x.beginPath();x.rect(s.x,s.y,s.w,s.h)}x.clip();x.fillStyle='#e9e9e9';x.fillRect(s.x,s.y,s.w,s.h);
  const im=IMGS[s.id];
  if(im){const c=cropOf(s.k),base=Math.max(s.w/im.naturalWidth,s.h/im.naturalHeight),sc=base*c.z,dw=im.naturalWidth*sc,dh=im.naturalHeight*sc,mx=(dw-s.w)/2/s.w,my=(dh-s.h)/2/s.h;
    c.x=Math.max(-mx,Math.min(mx,c.x));c.y=Math.max(-my,Math.min(my,c.y));
    x.drawImage(im,s.x+(s.w-dw)/2+c.x*s.w,s.y+(s.h-dh)/2+c.y*s.h,dw,dh)}
  x.restore()}
function drawLabel(x,s,st){if(!s.l)return;x.font=`bold 34px ${FONT}`;x.textAlign='left';x.textBaseline='middle';const tw=Math.min(x.measureText(s.l).width,s.w-80);
  x.fillStyle=st.label;rr(x,s.x+18,s.y+18,tw+40,60,30);x.fill();x.fillStyle=st.labelText;fitFont(x,s.l,s.w-80,34,'bold');x.fillText(s.l,s.x+38,s.y+49)}
function draw(){const cv=$('#cmp');if(!cv||!CMP)return;const r=recOf(CMP.id),P=postOf(r),[W,H]=cmpSize(),st=STYLES[P.style]||STYLES[0],x=cv.getContext('2d'),a=area(),ss=slots(),title=String(titleOf(r)).trim(),sub=String(P.sub).trim();
  cv.width=W;cv.height=H;x.globalAlpha=1;
  if(P.tpl==='polaroid'){
    x.fillStyle=st.bg;x.fillRect(0,0,W,H);
    for(const s of ss){x.save();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=24;x.shadowOffsetY=6;x.fillStyle='#fff';x.fillRect(s.x-24,s.y-24,s.w+48,s.h+48);x.restore()}
    ss.forEach(s=>{drawPhoto(x,s,0);drawLabel(x,s,st)});
    const tb=a.y+a.h+24,rg=H-tb-50;
    if(sub){txt(x,title,W/2,tb+rg*.38,54,'bold',st.text,W-120);txt(x,sub,W/2,tb+rg*.72,36,'normal',st.text,W-120)}
    else txt(x,title,W/2,tb+rg*.5,54,'bold',st.text,W-120);
    x.globalAlpha=.7;txt(x,APP_NAME,W/2,H-40,26,'normal',st.text,W);x.globalAlpha=1}
  else if(P.tpl==='magazine'){
    x.fillStyle='#111';x.fillRect(0,0,W,H);ss.forEach(s=>drawPhoto(x,s,0));
    const g=x.createLinearGradient(0,H-480,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=g;x.fillRect(0,H-480,W,480);
    ss.forEach(s=>drawLabel(x,s,st));
    let y=H-80;x.globalAlpha=.8;txt(x,APP_NAME,60,y,26,'normal','#fff',W,'left');x.globalAlpha=1;
    if(sub){y-=66;txt(x,sub,60,y,38,'normal','#fff',W-120,'left')}
    if(title){y-=sub?78:82;txt(x,title,60,y,64,'bold','#fff',W-120,'left');x.fillStyle=st.label;x.fillRect(60,y-64,90,8)}}
  else if(P.tpl==='frame'){
    x.fillStyle=st.label;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.22)';
    for(let yy=20,row=0;yy<H;yy+=56,row++)for(let xx=(row%2?48:20);xx<W;xx+=56){x.beginPath();x.arc(xx,yy,7,0,Math.PI*2);x.fill()}
    x.fillStyle='#fff';rr(x,60,a.top,W-120,H-a.top-110,30);x.fill();
    ss.forEach(s=>{drawPhoto(x,s,16);drawLabel(x,s,st)});
    if(sub){txt(x,title,W/2,74,54,'bold',st.labelText,W-140);txt(x,sub,W/2,142,34,'normal',st.labelText,W-140)}
    else txt(x,title,W/2,a.top/2,54,'bold',st.labelText,W-140);
    x.globalAlpha=.85;txt(x,APP_NAME,W/2,H-55,28,'normal',st.labelText,W);x.globalAlpha=1}
  else{
    x.fillStyle=st.bg;x.fillRect(0,0,W,H);ss.forEach(s=>{drawPhoto(x,s,24);drawLabel(x,s,st)});
    txt(x,title,W/2,80,54,'bold',st.text,W-80);if(sub)txt(x,sub,W/2,150,36,'normal',st.text,W-80);
    x.globalAlpha=.8;txt(x,APP_NAME,W/2,H-45,30,'normal',st.text,W);x.globalAlpha=1}}
function redrawSoon(){if(!RAF)RAF=requestAnimationFrame(()=>{RAF=0;draw()})}
function bindCmp(){const cv=$('#cmp');if(!cv)return;const pts=new Map();let act=null;
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
    if(!pts.size)act=slots().find(s=>p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h)||null;pts.set(e.pointerId,p)});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!act)return;e.preventDefault();
    const prev=pts.get(e.pointerId),cur=pos(e),c=cropOf(act.k);
    if(pts.size===1){c.x+=(cur.x-prev.x)/act.w;c.y+=(cur.y-prev.y)/act.h}
    else{const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(cur.x-o.x,cur.y-o.y);
      if(d0>0)c.z=Math.min(5,Math.max(1,c.z*d1/d0));c.x+=(cur.x-prev.x)/2/act.w;c.y+=(cur.y-prev.y)/2/act.h}
    pts.set(e.pointerId,cur);redrawSoon()});
  const end=e=>{if(!pts.delete(e.pointerId))return;if(!pts.size){act=null;save()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end)}
function tagList(){const r=recOf(CMP.id),p=place(r.placeId);return[...new Set([shopTag(p),...tagsOf(p),APP_TAG].filter(Boolean))]}
const tagText=()=>tagList().filter(t=>!CMP.off.includes(t)).join(' ');
function toggleTag(i){const t=tagList()[i];CMP.off=CMP.off.includes(t)?CMP.off.filter(x=>x!==t):[...CMP.off,t];render()}
function setCmp(k,v){CMP[k]=v;render()}
async function setPost(k,v){const P=postOf(recOf(CMP.id));P[k]=v;S.settings.postDef={...(S.settings.postDef||{}),[k]:v};await save();render()}
function setTxt(k,v){postOf(recOf(CMP.id))[k]=v;redrawSoon()}
async function resetTitle(){delete postOf(recOf(CMP.id)).title;await save();render()}
async function resetCrop(){const r=recOf(CMP.id);if(r.crop&&r.crop[CMP.size])for(const s of slots())delete r.crop[CMP.size][s.k];await save();draw()}
function phrases(){const r=recOf(CMP.id),p=place(r.placeId);return{mine:S.settings.phrases,base:[...DEF_PHRASES,p.id==='home'?'おうちでセルフトリミング':`${p.name}でトリミング`]}}
async function usePhrase(t,i){const ph=phrases();postOf(recOf(CMP.id)).sub=t==='m'?ph.mine[i]:ph.base[i];await save();render()}
async function savePhrase(){const v=String(postOf(recOf(CMP.id)).sub).trim();if(!v)return toast('ひとことを入れてから保存してください');
  if(!S.settings.phrases.includes(v))S.settings.phrases.unshift(v);await save();render();toast('保存しました。次からも選べます')}
async function delPhrase(i){S.settings.phrases.splice(i,1);await save();render()}
V.compare=id=>{const r=recOf(id);if(!r)return V.home();
  if(!CMP||CMP.id!==id)CMP={id,size:'post',mode:r.before&&r.after?'both':'after',off:[]};
  if(!r.before&&!r.after)return shell('インスタに投稿',`<p>写真がありません。記録を編集して写真を入れてください。</p>`,{back:1});
  const both=r.before&&r.after;if(!both)CMP.mode='after';const P=postOf(r),ph=phrases();
  const seg=(k,obj)=>`<div class="seg" style="margin-top:8px">${Object.entries(obj).map(([v,l])=>`<button class="${String(CMP[k])===v?'on':''}" onclick="setCmp('${k}','${v}')">${esc(l)}</button>`).join('')}</div>`;
  const tags=tagList().map((t,i)=>`<span class="tag ${CMP.off.includes(t)?'off':''}" onclick="toggleTag(${i})">${esc(t)}</span>`).join('');
  const chips=ph.mine.map((t,i)=>`<span class="chip mine" onclick="usePhrase('m',${i})">${esc(t)}<b style="color:#d33;margin-left:8px" onclick="event.stopPropagation();delPhrase(${i})">✕</b></span>`).join('')+ph.base.map((t,i)=>`<span class="chip" onclick="usePhrase('b',${i})">${esc(t)}</span>`).join('');
  return shell('インスタに投稿',`${both?seg('mode',MODES):''}${seg('size',SIZES)}
<canvas id="cmp"></canvas><p class="muted" style="text-align:center;margin-top:4px">写真を指で動かせます。2本指で拡大・縮小　<a href="javascript:resetCrop()" style="color:var(--main)">元に戻す</a></p>
<div class="sec">デザイン</div><div class="seg sm">${Object.entries(TPLS).map(([v,l])=>`<button class="${P.tpl===v?'on':''}" onclick="setPost('tpl','${v}')">${l}</button>`).join('')}</div>
<label>色</label><div class="sws">${STYLES.map((s,i)=>`<button class="sw ${P.style===i?'on':''}" onclick="setPost('style',${i})"><i style="background:linear-gradient(135deg,${s.bg} 50%,${s.label} 50%)"></i>${s.name}</button>`).join('')}</div>
<div class="sec">文字</div><div class="card">
<label>タイトル（空にすると出ません）</label><input value="${esc(titleOf(r))}" oninput="setTxt('title',this.value)" onchange="save()">
${P.title!=null?`<button class="link" onclick="resetTitle()">名前と日付に戻す</button>`:''}
<label>ひとこと（任意）</label><input value="${esc(P.sub)}" placeholder="例：今月もかわいくしてもらいました" oninput="setTxt('sub',this.value)" onchange="save()">
<div class="muted" style="margin-top:10px">テンプレート（押すと入ります）</div><div>${chips}</div>
<button class="link" onclick="savePhrase()">＋ 今のひとことをテンプレートに保存</button>
<label class="chk" style="margin-top:16px"><input type="checkbox" ${P.label?'checked':''} onchange="setPost('label',this.checked)">写真に BEFORE / AFTER の文字を出す</label>
${P.label?`<div class="row"><div><label>ビフォーの文字</label><input value="${esc(P.lb)}" oninput="setTxt('lb',this.value)" onchange="save()"></div><div><label>アフターの文字</label><input value="${esc(P.la)}" oninput="setTxt('la',this.value)" onchange="save()"></div></div>`:''}
</div>
<div class="sec">ハッシュタグ</div><p class="muted" style="margin-top:0">押すとオン・オフできます。</p><div>${tags}</div>
<button class="link" onclick="copyText(tagText())">ハッシュタグだけコピー</button>
<p class="muted">下の「インスタに投稿する」を押すと、ハッシュタグも自動でコピーされます。インスタの文章欄を長押しして「ペースト」してください。</p>`,{back:1,bar:`<button class="btn" onclick="postNow()">インスタに投稿する</button>`})};
AFTER.compare=async id=>{const r=recOf(id);if(!r)return;
  for(const k of['before','after'])if(r[k]&&!IMGS[r[k]]){const d=await getImg(r[k]);if(d)IMGS[r[k]]=await loadSrc(d)}
  draw();bindCmp()};
function dataToFile(d,name){const[h,b]=d.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:mime})}
function shareImg(){const cv=$('#cmp');if(!cv)return;const data=cv.toDataURL('image/jpeg',0.92);const f=dataToFile(data,'trimlog.jpg');
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=data;a.download='trimlog.jpg';a.click()}}
function postNow(){save();const t=tagText();try{if(t&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}
  shareImg();if(t)toast('ハッシュタグをコピーしました。インスタの文章欄に貼り付けてね')}
function copyText(t){const done=()=>toast('コピーしました');
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}

/* ===== カレンダー ===== */
const icsDT=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function openIcs(evs){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//trimlog//JP','CALSCALE:GREGORIAN'];
  for(const v of evs){L.push('BEGIN:VEVENT','UID:'+uid()+'@trimlog','DTSTAMP:'+icsUTC(new Date()),'DTSTART:'+icsDT(v.s),'DTEND:'+icsDT(v.e),'SUMMARY:'+icsEsc(v.sum));
    if(v.desc)L.push('DESCRIPTION:'+icsEsc(v.desc));if(v.loc)L.push('LOCATION:'+icsEsc(v.loc));
    for(const a of v.als)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(v.sum),a,'END:VALARM');L.push('END:VEVENT')}
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));document.body.appendChild(a);a.click();a.remove()}
function calItem(o){const d=dog(o.dogId),p=place(o.placeId),start=new Date(o.at);
  if(!o.at||isNaN(start))return toast('予約日時が入っていません');
  const end=new Date(start.getTime()+3600000),title=`${d?.name||''} トリミング（${p.name}）`;
  const desc=[o.menu?'予約内容：'+o.menu:'',p.tel&&p.id!=='home'?'電話：'+p.tel:''].filter(Boolean).join('\n');const loc=p.id!=='home'?p.name:'';
  const al=validRems(o.rem).map(x=>{const t=new Date(start);t.setDate(t.getDate()-x.d);const[h,m]=String(x.t||'09:00').split(':').map(Number);t.setHours(h||0,m||0,0,0);return t}).sort((a,b)=>a-b);
  const evs=[{s:start,e:end,sum:title,desc,loc,als:al.slice(0,2).map(t=>'TRIGGER;VALUE=DATE-TIME:'+icsUTC(t))}];
  al.slice(2).forEach(t=>evs.push({s:t,e:new Date(t.getTime()+900000),sum:'【通知】'+title,desc,loc,als:['TRIGGER:PT0M']}));
  openIcs(evs);
  if(al.length>2)toast('通知が3つ以上あるので、カレンダーで「すべてを追加」を選んでください')}
function remindCal(id){const r=recOf(id),d=dog(r?.dogId);if(!r||!d)return;const p=place(r.placeId),t=dueDate(d,r);
  const desc=`前回：${fmtDate(r.date)} ${p.name}`;
  openIcs([{s:t,e:new Date(t.getTime()+900000),sum:`${d.name} そろそろトリミングの予約を`,desc,loc:'',als:['TRIGGER:PT0M']}])}

/* ===== 起動 ===== */
function fixS(){S.dogs=S.dogs||[];S.places=S.places||[];S.records=S.records||[];S.favs=S.favs||[];S.resv=S.resv||[];S.settings=S.settings||{};
  if(!Array.isArray(S.settings.defRem))S.settings.defRem=clone(DEF_REM);
  if(!Array.isArray(S.settings.phrases))S.settings.phrases=[];
  if(!S.settings.postDef||typeof S.settings.postDef!=='object')S.settings.postDef={tpl:'simple',style:0,label:true};
  S.dogs.forEach(d=>{if(d.interval==null)d.interval=DEF_IV;if(!d.rTime)d.rTime=DEF_RT});
  if(!S.places.some(p=>p.id==='home'))S.places.unshift({id:'home',name:'自宅',tags:['#おうちトリミング','#セルフトリミング']});
  S.places.forEach(p=>p.tags=tagsOf(p));
  S.records.forEach(r=>{if(!r.created)r.created=0;if(!r.date)r.date=today();
    if(r.nextAt){if(!S.resv.some(x=>x.fromRec===r.id))S.resv.push({id:uid(),dogId:r.dogId,placeId:r.placeId,at:r.nextAt,menu:r.nextMenu||'',rem:validRems(r.rem),fromRec:r.id})}
    delete r.nextAt;delete r.nextMenu;delete r.rem})}
(async()=>{try{await openDB();const s=await dbGet('state');if(s)S=s;fixS();await save();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});render()}
  catch(e){document.body.innerHTML='<p style="padding:20px">データを読み込めませんでした。Safariを開き直してください。</p>'}})();
</script>
