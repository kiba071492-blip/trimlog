<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トリミングログ">
<meta name="theme-color" content="#ffffff">
<title>トリミングログ</title>
<style>
:root{--main:#e8758f;--bg:#fff7f8;--text:#333;--sub:#888}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#fff;border-bottom:1px solid #f0d5db;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{padding:16px;max-width:600px;margin:0 auto}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;margin:8px 0}
.btn.sub{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.danger{background:#fff;color:#d33;border:2px solid #d33}
.back{background:none;border:none;font-size:16px;color:var(--main);padding:0}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;background:#fff;font-family:inherit;color:var(--text)}
textarea{min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.photo{aspect-ratio:3/4;background:#f3e3e6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{font-size:40px;font-weight:bold;color:var(--main)}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;padding:6px 12px;margin:4px;border-radius:20px;border:1px solid var(--main);color:var(--main);font-size:14px}
.tag.off{border-color:#ccc;color:#bbb;text-decoration:line-through}
.list-item{display:flex;align-items:center;gap:12px}
.list-item .photo{width:56px;flex:none;border-radius:8px}
.order{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
.order .memo{font-size:26px;line-height:1.6;white-space:pre-wrap;font-weight:bold;margin-top:16px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:50;max-width:90%;text-align:center}
#preview{width:100%;border-radius:12px;display:block;margin-top:12px;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.remrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.remrow select{flex:1.2}.remrow input{flex:1}
.remrow button{flex:none;width:44px;height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#d33;font-size:18px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:14px;font-weight:bold}
.seg button.on{background:var(--main);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_NAME='トリミングログ';
const APP_TAG='#トリミングログ';
const DAYS=[0,1,2,3,5,7,10,14,21,30];
const DEF_REM=[{d:1,t:'20:00'},{d:0,t:'09:00'}];
const STYLES=[{bg:'#fff7f8',text:'#e8758f',label:'#e8758f',labelText:'#fff'},{bg:'#2b2b2b',text:'#fff',label:'#f7c948',labelText:'#2b2b2b'}];
const FONT='-apple-system,"Hiragino Sans",sans-serif';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fmtDate=s=>s?s.replace(/-/g,'/'):'';
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const dayLabel=d=>d===0?'当日':d+'日前';
const validRems=list=>(list||[]).filter(o=>o&&typeof o==='object');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}

/* ---- 保存（IndexedDB） ---- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('trimlog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbGet(k){return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbSet(k,v){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDel(k){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

let S={dogs:[],places:[],records:[],settings:{defRem:DEF_REM.map(x=>({...x}))}};
const imgCache=new Map();
const save=()=>dbSet('state',S);
async function putImg(data){const id='img_'+uid();await dbSet(id,data);imgCache.set(id,data);return id}
async function getImg(id){if(!id)return null;if(imgCache.has(id))return imgCache.get(id);const v=await dbGet(id);if(v)imgCache.set(id,v);return v}
async function delImg(id){if(id){await dbDel(id);imgCache.delete(id)}}
async function hydrate(){for(const el of document.querySelectorAll('img[data-img]')){const v=await getImg(el.dataset.img);if(v)el.src=v}}

const dog=id=>S.dogs.find(d=>d.id===id);
const place=id=>S.places.find(p=>p.id===id)||S.places[0];
const recsOf=dogId=>S.records.filter(r=>r.dogId===dogId).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const cover=r=>r.after||r.before;

/* ---- 写真 ---- */
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadSrc(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function toPhoto(file){
  const url=URL.createObjectURL(file);const im=await loadSrc(url);
  const W=900,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;
  const r=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;
  c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.85);
}
function drawCover(x,im,dx,dy,dw,dh){const r=Math.max(dw/im.naturalWidth,dh/im.naturalHeight),sw=dw/r,sh=dh/r;x.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,dx,dy,dw,dh)}
const normTags=s=>[...new Set(s.split(/[\s,、　]+/).filter(Boolean).map(t=>'#'+t.replace(/^[#＃]+/,'')).filter(t=>t.length>1))].slice(0,5);

/* ---- 画面の切り替え ---- */
const V={},AFTER={};
let view='home',param=null;
function go(v,p){view=v;param=p;window.scrollTo(0,0);render()}
function render(){$('#app').innerHTML=V[view](param);hydrate();if(AFTER[view])AFTER[view](param)}
function shell(title,body,back="go('home')"){return `<header>${back?`<button class="back" onclick="${back}">‹ 戻る</button>`:''}<h1>${esc(title)}</h1></header><main>${body}</main>`}
const installHint=()=>navigator.standalone?'':`<div class="card muted">Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように使えて、データも消えにくくなります。</div>`;
const dogSelect=(cur,v)=>S.dogs.length>1?`<select onchange="go('${v}',this.value)" style="margin-bottom:12px">${S.dogs.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:'';

/* ---- 通知の編集 ---- */
const remEditor=list=>`<div>${list.map((r,i)=>`<div class="remrow"><select class="rem_d">${DAYS.map(d=>`<option value="${d}" ${d===r.d?'selected':''}>${dayLabel(d)}</option>`).join('')}</select><input type="time" class="rem_t" value="${esc(r.t)}"><button onclick="delRem(${i})">✕</button></div>`).join('')||'<p class="muted">通知なし</p>'}</div><button class="btn sub" onclick="addRem()">＋ 通知を追加</button>`;
function readRems(){return [...document.querySelectorAll('.remrow')].map(el=>({d:Number(el.querySelector('.rem_d').value),t:el.querySelector('.rem_t').value||'09:00'}))}
let RD=null;
function remList(){if(view==='recEdit'){syncD();return D.rem}RD=readRems();return RD}
function addRem(){remList().push({d:0,t:'09:00'});render()}
function delRem(i){remList().splice(i,1);render()}

/* ホーム */
V.home=()=>{
  if(!S.dogs.length)return shell(APP_NAME,`<div class="card"><p>まずはワンちゃんを登録しましょう。</p><button class="btn" onclick="go('dogEdit')">ワンちゃんを登録する</button></div>${installHint()}`,'');
  const now=new Date();
  const next=S.records.filter(r=>r.nextAt&&new Date(r.nextAt)>now).sort((a,b)=>a.nextAt.localeCompare(b.nextAt))[0];
  let nx='<div class="muted">次回の予約はまだありません</div>';
  if(next){const n=new Date(next.nextAt);const days=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
    nx=`<div class="muted">次回の予約（${esc(dog(next.dogId)?.name)}・${esc(place(next.placeId).name)}）</div><div class="count">${days===0?'今日':'あと'+days+'日'}</div><div>${fmtDT(next.nextAt)}</div>`}
  const recent=[...S.records].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5);
  return shell(APP_NAME,`<div class="card">${nx}</div>
  <button class="btn" onclick="newRecord()">トリミングを記録する</button>
  <div class="row"><button class="btn sub" onclick="go('order')">オーダー画面</button><button class="btn sub" onclick="go('history')">履歴</button></div>
  <h3>最近の記録</h3>
  ${recent.map(r=>`<div class="card list-item" onclick="go('detail','${r.id}')"><div class="photo">${cover(r)?`<img data-img="${cover(r)}">`:''}</div><div style="flex:1"><b>${esc(dog(r.dogId)?.name)}</b><div class="muted">${fmtDate(r.date)}・${esc(place(r.placeId).name)}</div></div>›</div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}
  <button class="btn sub" onclick="go('settings')">設定・バックアップ</button>${installHint()}`,'');
};

/* 設定・バックアップ */
let exportFile=null;
V.settings=()=>shell('設定',`<button class="btn sub" onclick="go('dogs')">ワンちゃんの管理</button><button class="btn sub" onclick="go('places')">場所（サロン）の管理</button><button class="btn sub" onclick="RD=null;go('remDefaults')">通知の初期設定</button>
<div class="card"><b>バックアップ</b><p class="muted">ホーム画面のアイコンを消すとデータも消えます。ときどき保存してください。</p>
${exportFile?`<button class="btn" onclick="shareExport()">準備できました：ファイルに保存する</button>`:`<button class="btn" onclick="exportData()">バックアップを作る</button>`}
<button class="btn sub" onclick="importData()">バックアップから復元</button></div>`);
V.remDefaults=()=>{if(!RD)RD=S.settings.defRem.map(x=>({...x}));return shell('通知の初期設定',`<p class="muted">新しく記録を作るときに、最初から入る通知です。記録ごとに変えることもできます。</p>${remEditor(RD)}<button class="btn" onclick="saveRemDef()">保存する</button>`,"RD=null;go('settings')")};
async function saveRemDef(){S.settings.defRem=readRems();RD=null;await save();toast('保存しました');go('settings')}
async function exportData(){toast('準備しています…');const imgs={};for(const r of S.records)for(const k of[r.before,r.after])if(k)imgs[k]=await getImg(k);
  exportFile=new File([JSON.stringify({v:1,S,imgs})],`trimlog-backup-${today()}.json`,{type:'application/json'});render()}
function shareExport(){if(navigator.canShare&&navigator.canShare({files:[exportFile]})){navigator.share({files:[exportFile]}).catch(()=>{})}else{const a=document.createElement('a');a.href=URL.createObjectURL(exportFile);a.download=exportFile.name;a.click()}exportFile=null;setTimeout(render,500)}
async function importData(){const f=await pickFile('.json,application/json');if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o.S||!o.imgs)throw 0;if(!confirm('今のデータを、バックアップの内容で置き換えます。よろしいですか？'))return;
    for(const[k,v]of Object.entries(o.imgs)){await dbSet(k,v);imgCache.set(k,v)}S=o.S;if(!S.settings)S.settings={defRem:DEF_REM.map(x=>({...x}))};await save();toast('復元しました');go('home')}
  catch(e){toast('バックアップを読み込めませんでした')}}

/* ワンちゃん */
V.dogs=()=>shell('ワンちゃん',S.dogs.map(d=>`<div class="card list-item" onclick="go('dogEdit','${d.id}')"><div style="flex:1"><b>${esc(d.name)}</b><div class="muted">${esc(d.breed)}</div></div>›</div>`).join('')+`<button class="btn" onclick="go('dogEdit')">＋ 追加する</button>`,"go('settings')");
V.dogEdit=id=>{const d=dog(id)||{};return shell(id?'ワンちゃんを編集':'ワンちゃんを登録',`<label>名前</label><input id="f_name" value="${esc(d.name)}"><label>犬種</label><input id="f_breed" value="${esc(d.breed)}"><label>メモ</label><textarea id="f_memo">${esc(d.memo)}</textarea>
<button class="btn" onclick="saveDog('${id||''}')">保存する</button>${id?`<button class="btn danger" onclick="delDog('${id}')">削除する</button>`:''}`,S.dogs.length?"go('dogs')":"go('home')")};
async function saveDog(id){const name=$('#f_name').value.trim();if(!name)return toast('名前を入れてください');const v={name,breed:$('#f_breed').value.trim(),memo:$('#f_memo').value};
  const first=!S.dogs.length;if(id)Object.assign(dog(id),v);else S.dogs.push({id:uid(),...v});await save();go(first?'home':'dogs')}
async function delDog(id){if(!confirm('このワンちゃんと、すべての記録を削除します。よろしいですか？'))return;
  for(const r of S.records.filter(r=>r.dogId===id)){await delImg(r.before);await delImg(r.after)}
  S.records=S.records.filter(r=>r.dogId!==id);S.dogs=S.dogs.filter(d=>d.id!==id);await save();go('home')}

/* 場所 */
V.places=()=>shell('場所（サロン）',S.places.map(p=>`<div class="card" onclick="go('placeEdit','${p.id}')"><b>${esc(p.name)}</b><div class="muted">${esc(p.tags.join(' '))}</div></div>`).join('')+`<button class="btn" onclick="go('placeEdit')">＋ サロンを追加</button>`,"go('settings')");
V.placeEdit=id=>{const p=S.places.find(x=>x.id===id)||{tags:[]};return shell(id?'場所を編集':'サロンを追加',`<label>名前</label><input id="f_name" value="${esc(p.name)}" ${id==='home'?'readonly':''}>
<label>ハッシュタグ（空白で区切る・5個まで）</label><input id="f_tags" value="${esc(p.tags.join(' '))}" placeholder="#サロン名 #地域名トリミング">
<button class="btn" onclick="savePlace('${id||''}')">保存する</button>${id&&id!=='home'?`<button class="btn danger" onclick="delPlace('${id}')">削除する</button>`:''}`,"go('places')")};
async function savePlace(id){const name=$('#f_name').value.trim();if(!name)return toast('名前を入れてください');const v={name,tags:normTags($('#f_tags').value)};
  if(id)Object.assign(S.places.find(x=>x.id===id),v);else S.places.push({id:uid(),...v});await save();go('places')}
async function delPlace(id){if(!confirm('この場所を削除します。よろしいですか？'))return;S.records.forEach(r=>{if(r.placeId===id)r.placeId='home'});S.places=S.places.filter(p=>p.id!==id);await save();go('places')}

/* 記録の作成・編集 */
let D=null;
function newRecord(){const last=[...S.records].sort((a,b)=>b.created-a.created)[0];
  D={id:null,dogId:S.dogs[0].id,placeId:last&&S.places.some(p=>p.id===last.placeId)?last.placeId:'home',date:today(),before:null,after:null,memo:'',nextAt:'',rem:S.settings.defRem.map(x=>({...x}))};go('recEdit')}
function editRecord(id){const r=S.records.find(x=>x.id===id);D={...r,rem:validRems(r.rem).map(x=>({...x}))};go('recEdit')}
const photoBox=(k,label,data,id)=>`<div><div class="muted" style="margin-bottom:4px">${label}</div><div class="photo" onclick="pickFor('${k}')">${data?`<img src="${data}">`:id?`<img data-img="${id}">`:'＋ 撮影'}</div></div>`;
V.recEdit=()=>{const r=D;return shell(r.id?'記録を編集':'トリミングを記録',`
<label>ワンちゃん</label><select id="f_dog">${S.dogs.map(d=>`<option value="${d.id}" ${d.id===r.dogId?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
<div class="row"><div><label>日付</label><input type="date" id="f_date" value="${r.date}"></div><div><label>場所</label><select id="f_place">${S.places.map(p=>`<option value="${p.id}" ${p.id===r.placeId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>
<div class="row" style="margin-top:12px">${photoBox('before','ビフォー',r.bData,r.before)}${photoBox('after','アフター',r.aData,r.after)}</div>
<p class="muted">写真をタップすると撮影・選択できます。アフターは後から追加してもOKです。</p>
<label>カットのメモ</label><textarea id="f_memo" placeholder="例：顔周りは短め、耳は残す">${esc(r.memo)}</textarea>
<button class="btn sub" onclick="copyPrevMemo()">前回のメモをコピー</button>
<label>次回の予約（任意）</label><input type="datetime-local" id="f_next" value="${r.nextAt||''}">
<label>通知（日にちと時刻を選べます）</label>${remEditor(r.rem)}
<button class="btn" onclick="saveRecord()">保存する</button>`,r.id?`go('detail','${r.id}')`:"go('home')")};
function syncD(){D.dogId=$('#f_dog').value;D.date=$('#f_date').value;D.placeId=$('#f_place').value;D.memo=$('#f_memo').value;D.nextAt=$('#f_next').value;D.rem=readRems()}
async function pickFor(k){syncD();const f=await pickFile('image/*');if(!f)return;try{const d=await toPhoto(f);if(k==='before')D.bData=d;else D.aData=d;render()}catch(e){toast('写真を読み込めませんでした')}}
function copyPrevMemo(){syncD();const prev=recsOf(D.dogId).find(r=>r.id!==D.id&&r.memo);if(!prev)return toast('前回のメモがありません');D.memo=prev.memo;render()}
async function saveRecord(){syncD();if(!D.date)return toast('日付を入れてください');
  const old=D.id?S.records.find(r=>r.id===D.id):null;
  if(D.bData){if(old)await delImg(old.before);D.before=await putImg(D.bData)}
  if(D.aData){if(old)await delImg(old.after);D.after=await putImg(D.aData)}
  const rec={id:D.id||uid(),dogId:D.dogId,placeId:D.placeId,date:D.date,before:D.before||null,after:D.after||null,memo:D.memo,nextAt:D.nextAt,rem:D.rem,created:old?old.created:Date.now()};
  if(old)Object.assign(old,rec);else S.records.push(rec);await save();D=null;go('detail',rec.id)}
async function delRecord(id){if(!confirm('この記録を削除します。よろしいですか？'))return;const r=S.records.find(x=>x.id===id);await delImg(r.before);await delImg(r.after);S.records=S.records.filter(x=>x.id!==id);await save();go('home')}

/* 記録の詳細 */
V.detail=id=>{const r=S.records.find(x=>x.id===id);if(!r)return V.home();const p=place(r.placeId);const rems=validRems(r.rem);
  return shell(`${dog(r.dogId)?.name||''} ${fmtDate(r.date)}`,`
<div class="row">${[['before','ビフォー'],['after','アフター']].map(([k,l])=>`<div><div class="muted">${l}</div><div class="photo">${r[k]?`<img data-img="${r[k]}">`:'なし'}</div></div>`).join('')}</div>
<div class="card"><div class="muted">場所</div>${esc(p.name)}<div class="muted" style="margin-top:8px">カットのメモ</div><div style="white-space:pre-wrap">${esc(r.memo)||'—'}</div>
${r.nextAt?`<div class="muted" style="margin-top:8px">次回の予約</div>${fmtDT(r.nextAt)}${rems.length?`<div class="muted" style="margin-top:8px">通知</div>${rems.map(o=>`${dayLabel(o.d)} ${esc(o.t)}`).join('、')}`:''}`:''}</div>
${r.before&&r.after?`<button class="btn" onclick="go('share','${r.id}')">比較画像を作ってインスタに共有</button>`:`<p class="muted">ビフォーとアフターがそろうと比較画像を作れます。</p>`}
${r.nextAt?`<button class="btn sub" onclick="addCal('${r.id}')">予約と通知をカレンダーに追加</button><p class="muted">カレンダーに追加すると、設定した日時に通知が届きます。</p>`:''}
<button class="btn sub" onclick="editRecord('${r.id}')">編集する</button><button class="btn danger" onclick="delRecord('${r.id}')">削除する</button>`)};

/* 比較画像と共有 */
let shareBlob=null,shareTags=[],shareStyle=0,shareFmt='feed',shareRec=null;
V.share=id=>{shareRec=S.records.find(x=>x.id===id);shareTags=[...place(shareRec.placeId).tags,APP_TAG].map(t=>({t,on:true}));
  const b=(k,v,l,on)=>`<button data-k="${k}" data-v="${v}" class="${on?'on':''}" onclick="setShare('${k}','${v}')">${l}</button>`;
  return shell('比較画像',`<label>サイズ</label><div class="seg">${b('fmt','feed','投稿用（縦4:5）',shareFmt==='feed')}${b('fmt','story','ストーリー・リール用',shareFmt==='story')}</div>
<label>デザイン</label><div class="seg">${b('style','0','ピンク',shareStyle===0)}${b('style','1','ブラック',shareStyle===1)}</div>
<img id="preview" alt=""><p class="muted" id="gen"></p>
<label>ハッシュタグ（タップで外せます）</label><div id="tags"></div>
<button class="btn" onclick="shareInsta()">ハッシュタグをコピーして共有</button>
<button class="btn sub" onclick="copyTags(true)">ハッシュタグだけコピー</button>
<p class="muted">共有メニューで「Instagram」を選び、文章の欄を長押しして「ペースト」してください。「画像を保存」を選ぶとカメラロールに保存できます。</p>`,`go('detail','${id}')`)};
AFTER.share=()=>{renderTags();makeCompare()};
function setShare(k,v){if(k==='fmt')shareFmt=v;else shareStyle=Number(v);
  document.querySelectorAll('[data-k]').forEach(el=>el.classList.toggle('on',el.dataset.v===(el.dataset.k==='fmt'?shareFmt:String(shareStyle))));makeCompare()}
function renderTags(){const el=$('#tags');if(el)el.innerHTML=shareTags.map((o,i)=>`<span class="tag ${o.on?'':'off'}" onclick="shareTags[${i}].on=!shareTags[${i}].on;renderTags()">${esc(o.t)}</span>`).join('')}
async function makeCompare(){const r=shareRec;shareBlob=null;const g=$('#gen');if(g)g.textContent='画像を作っています…';
  const ib=await loadSrc(await getImg(r.before)),ia=await loadSrc(await getImg(r.after));
  const st=STYLES[shareStyle],story=shareFmt==='story';
  const W=1080,H=story?1920:1350,pad=story?30:24,top=story?200:140,bottom=story?130:90;
  let boxes,headY,footY;
  if(story){const bw=W-pad*2,bh=(H-top-bottom-pad)/2;boxes=[[pad,top,bw,bh],[pad,top+bh+pad,bw,bh]];headY=top/2;footY=H-bottom/2}
  else{const bw=(W-pad*3)/2,bh=Math.min(H-top-bottom,bw*1.75),y=top+(H-top-bottom-bh)/2;boxes=[[pad,y,bw,bh],[pad*2+bw,y,bw,bh]];headY=y-60;footY=y+bh+50}
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle=st.bg;x.fillRect(0,0,W,H);x.textBaseline='middle';
  x.fillStyle=st.text;x.textAlign='left';x.font=`bold ${story?64:56}px ${FONT}`;x.fillText(dog(r.dogId)?.name||'',pad*2,headY);
  x.textAlign='right';x.font=`${story?44:40}px ${FONT}`;x.fillText(fmtDate(r.date),W-pad*2,headY);
  [[ib,'BEFORE'],[ia,'AFTER']].forEach(([im,lab],i)=>{const[bx,by,bw,bh]=boxes[i];drawCover(x,im,bx,by,bw,bh);
    x.fillStyle=st.label;x.fillRect(bx,by,200,64);x.fillStyle=st.labelText;x.textAlign='center';x.font=`bold 34px ${FONT}`;x.fillText(lab,bx+100,by+32)});
  x.fillStyle=st.text;x.textAlign='right';x.font=`32px ${FONT}`;x.fillText(APP_NAME,W-pad*2,footY);
  c.toBlob(bl=>{shareBlob=bl;const pv=$('#preview');if(pv)pv.src=URL.createObjectURL(bl);const g2=$('#gen');if(g2)g2.textContent=''},'image/jpeg',0.9)}
function copyTags(show){const text=shareTags.filter(o=>o.on).map(o=>o.t).join(' ');if(!text||!navigator.clipboard)return;
  navigator.clipboard.writeText(text).then(()=>{if(show)toast('ハッシュタグをコピーしました')}).catch(()=>{})}
function shareInsta(){if(!shareBlob)return toast('画像を作っています。少し待ってください');copyTags(false);
  const file=new File([shareBlob],'trimming.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(shareBlob);a.download='trimming.jpg';a.click()}}

/* カレンダー（.icsファイル） */
const icsLocal=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function remAt(st,o){const[h,m]=String(o.t).split(':').map(Number);const x=new Date(st);x.setDate(x.getDate()-o.d);x.setHours(h||0,m||0,0,0);return x}
function addCal(id){const r=S.records.find(x=>x.id===id);const st=new Date(r.nextAt),en=new Date(st.getTime()+7200000),now=new Date();
  const name=`${dog(r.dogId)?.name||''}のトリミング（${place(r.placeId).name}）`,title=icsEsc(name);
  const times=validRems(r.rem).map(o=>({o,at:remAt(st,o)})).filter(t=>t.at<=st&&t.at>now).sort((a,b)=>a.at-b.at);
  const alarm=at=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER;VALUE=DATE-TIME:'+icsUTC(at),'END:VALARM'];
  const ev=(u,s,e,sum,al)=>['BEGIN:VEVENT','UID:'+u,'DTSTAMP:'+icsUTC(now),'DTSTART:'+icsLocal(s),'DTEND:'+icsLocal(e),'SUMMARY:'+sum,...al,'END:VEVENT'];
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//trimlog//JP'];
  L.push(...ev(r.id+'@trimlog',st,en,title,times.slice(0,2).flatMap(t=>alarm(t.at))));
  times.slice(2).forEach((t,i)=>{const d=t.o.d;L.push(...ev(r.id+'-n'+i+'@trimlog',t.at,new Date(t.at.getTime()+900000),icsEsc(`【通知】${name} ${d===0?'今日':d===1?'明日':'あと'+d+'日'}`),alarm(t.at)))});
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='trimming.ics';document.body.appendChild(a);a.click();a.remove();
  toast(times.length>2?'表示された画面で「すべてを追加」を選んでください':'表示された画面で「カレンダーに追加」を選んでください')}

/* オーダー画面 */
V.order=id=>{const dogId=id||S.dogs[0]?.id;if(!dogId)return V.home();const rs=recsOf(dogId);const r=rs.find(x=>x.after)||rs[0];
  return `<div class="order"><button class="back" onclick="go('home')">‹ 閉じる</button><div style="height:12px"></div>${dogSelect(dogId,'order')}
  ${r?`<h2>${esc(dog(dogId).name)}　前回 ${fmtDate(r.date)}</h2>${cover(r)?`<div class="photo" style="max-width:420px;margin:0 auto"><img data-img="${cover(r)}"></div>`:''}<div class="memo">${esc(r.memo)||'メモなし'}</div>`:'<p>まだ記録がありません。</p>'}</div>`};
AFTER.order=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};

/* 履歴 */
V.history=id=>{const dogId=id||S.dogs[0]?.id;if(!dogId)return V.home();const rs=recsOf(dogId);
  return shell('カットの履歴',`${dogSelect(dogId,'history')}<div class="grid">${rs.map(r=>`<div onclick="go('detail','${r.id}')"><div class="photo">${cover(r)?`<img data-img="${cover(r)}">`:'写真なし'}</div><div class="muted">${fmtDate(r.date)}</div></div>`).join('')}</div>${rs.length?'':'<p class="muted">まだ記録がありません。</p>'}`)};

/* 起動 */
(async()=>{await openDB();const s=await dbGet('state');if(s)S=s;
  if(!S.settings)S.settings={defRem:DEF_REM.map(x=>({...x}))};
  if(!S.places.some(p=>p.id==='home'))S.places.unshift({id:'home',name:'自宅',tags:['#おうちトリミング','#セルフトリミング']});
  await save();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();go('home')})();
</script>
