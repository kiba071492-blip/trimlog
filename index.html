<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トリミングログ">
<meta name="theme-color" content="#ffffff">
<title>トリミングログ</title>
<style>
:root{--main:#e8758f;--bg:#fff7f8;--text:#333;--sub:#888}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#fff;border-bottom:1px solid #f0d5db;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{padding:16px;max-width:600px;margin:0 auto}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;margin:8px 0}
a.btn{text-align:center;text-decoration:none}
.btn.sub{background:#fff;color:var(--main);border:2px solid var(--main)}
.btn.danger{background:#fff;color:#d33;border:2px solid #d33}
.back{background:none;border:none;font-size:16px;color:var(--main);padding:0}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec{font-size:16px;font-weight:bold;margin:28px 0 8px;padding-left:10px;border-left:5px solid var(--main)}
.sec:first-child{margin-top:4px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.req{color:#d33;font-weight:bold;font-size:12px;margin-left:4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:10px;background:#fff;font-family:inherit;color:var(--text)}
textarea{min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.photo{aspect-ratio:3/4;background:#f3e3e6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden;font-size:13px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.big{background:#f7f7f7}
.photo.big img{object-fit:contain}
.count{font-size:40px;font-weight:bold;color:var(--main)}
.muted{color:var(--sub);font-size:13px}
.pre{white-space:pre-wrap}
.tag{display:inline-block;padding:6px 12px;margin:4px;border-radius:20px;border:1px solid var(--main);color:var(--main);font-size:14px}
.tag.off{border-color:#ccc;color:#bbb;text-decoration:line-through}
.chip{display:inline-block;padding:8px 12px;margin:4px 4px 0 0;border-radius:20px;border:1px solid #ddd;color:#888;font-size:14px;background:#fff}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.list-item{display:flex;align-items:center;gap:12px}
.list-item .photo{width:56px;flex:none;border-radius:8px}
.minicall{flex:none;padding:8px 12px;border:2px solid var(--main);border-radius:10px;color:var(--main);background:#fff;font-weight:bold;text-decoration:none;font-size:13px}
.stars{display:flex;gap:6px}
.stars button{flex:none;width:44px;height:44px;border:none;background:none;font-size:34px;color:#ddd;padding:0;line-height:1}
.stars button.on{color:#f5b301}
.star{color:#f5b301;letter-spacing:1px}
.star0{color:#ddd;letter-spacing:1px}
.rank{flex:none;width:30px;font-size:22px;font-weight:bold;color:var(--main);text-align:center}
.order{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 40px}
.order h2{margin:14px 0 2px;font-size:24px}
.order .memo{font-size:26px;line-height:1.6;white-space:pre-wrap;font-weight:bold;margin-top:16px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.thumb{flex:none;width:86px;text-align:center;font-size:12px;color:var(--sub)}
.thumb .photo{width:86px;border:3px solid transparent}
.thumb.on .photo{border-color:var(--main)}
.thumb.on{color:var(--main);font-weight:bold}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:50;max-width:90%;text-align:center}
#cmp{display:block;margin:12px auto 4px;width:auto;height:auto;max-width:100%;max-height:62vh;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.15);touch-action:none;-webkit-user-select:none;user-select:none}
.remrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.remrow select{flex:1.2}.remrow input{flex:1}
.remrow button{flex:none;width:44px;height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#d33;font-size:18px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:14px;font-weight:bold}
.seg button.on{background:var(--main);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_NAME='トリミングログ';
const APP_TAG='#トリミングログ';
const DAYS=[0,1,2,3,5,7,10,14,21,30];
const DEF_REM=[{d:1,t:'20:00'},{d:0,t:'09:00'}];
const MENUS=['カット','シャンプー','部分カット','爪切り','耳そうじ','肛門腺しぼり','歯みがき','パック・スパ'];
const CONDS=['元気','いつも通り','少し元気がない','体調が悪い'];
const STYLES=[{name:'ピンク',bg:'#fff7f8',text:'#e8758f',label:'#e8758f',labelText:'#fff'},{name:'ダーク',bg:'#2b2b2b',text:'#fff',label:'#f7c948',labelText:'#2b2b2b'}];
const SIZES={post:'投稿用（縦4:5）',story:'ストーリー・リール用'};
const MODES={both:'ビフォー＋アフター',after:'アフターだけ'};
const FONT='-apple-system,"Hiragino Sans",sans-serif';
const WD='日月火水木金土';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const nowTime=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const fmtDate=s=>s?s.replace(/-/g,'/'):'';
const visitStr=r=>fmtDate(r.date)+(r.time?' '+r.time:'');
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const daysTo=s=>{const n=new Date(s),t=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/86400000)};
const yen=p=>p?'¥'+Number(p).toLocaleString():'';
const dayLabel=d=>d===0?'当日':d+'日前';
const validRems=list=>(Array.isArray(list)?list:[]).filter(o=>o&&typeof o==='object'&&typeof o.d==='number');
const memoOf=r=>r.memo??r.order??r.note??'';
const starHtml=n=>n?`<span class="star">${'★'.repeat(n)}</span><span class="star0">${'★'.repeat(5-n)}</span>`:'';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

/* ---- 保存（IndexedDB） ---- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('trimlog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbGet(k){return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbSet(k,v){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbDel(k){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function dbClear(){return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

let S={dogs:[],places:[],records:[],favs:[],resv:[],settings:{defRem:clone(DEF_REM)}};
const imgCache=new Map();
const save=()=>dbSet('state',S);
async function putImg(data){const id='img_'+uid();await dbSet(id,data);imgCache.set(id,data);return id}
async function getImg(id){if(!id)return null;if(imgCache.has(id))return imgCache.get(id);const v=await dbGet(id);if(v)imgCache.set(id,v);return v}
async function delImg(id){if(id){await dbDel(id);imgCache.delete(id)}}
async function hydrate(){for(const el of document.querySelectorAll('img[data-img]')){const v=await getImg(el.dataset.img);if(v)el.src=v}}

const dog=id=>S.dogs.find(d=>d.id===id);
const place=id=>S.places.find(p=>p.id===id)||S.places[0];
const recOf=id=>S.records.find(r=>r.id===id);
const favOf=id=>S.favs.find(f=>f.id===id);
const recsOf=dogId=>S.records.filter(r=>r.dogId===dogId).sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||'')||b.created-a.created);
const cover=r=>r.after||r.before;
const normTags=s=>[...new Set(String(s).split(/[\s,、　]+/).filter(Boolean).map(t=>'#'+t.replace(/^[#＃]+/,'')).filter(t=>t.length>1))].slice(0,5);
const tagsOf=p=>!p?[]:Array.isArray(p.tags)?p.tags:normTags(p.tags||'');
const shopTag=p=>!p||p.id==='home'?null:'#'+String(p.name||'').replace(/[\s　#＃]+/g,'');

/* ---- お店の情報（電話・営業時間） ---- */
const telHref=t=>'tel:'+String(t||'').replace(/[^\d+]/g,'');
function placeBtns(p){if(!p||p.id==='home')return'';
  return `${p.hours?`<div class="muted pre" style="margin-top:8px">営業時間・定休日：${esc(p.hours)}</div>`:''}${p.tel?`<a class="btn sub" href="${telHref(p.tel)}">電話する（${esc(p.tel)}）</a>`:''}`}

/* ---- ランキング ---- */
function rankCuts(dg){return S.records.filter(r=>r.score>0&&(!dg||r.dogId===dg)).sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||''))}
function rankShops(dg){const m={};for(const r of S.records){if(!(r.score>0)||(dg&&r.dogId!==dg))continue;(m[r.placeId]=m[r.placeId]||[]).push(r.score)}
  return Object.entries(m).filter(([id])=>S.places.some(p=>p.id===id)).map(([id,a])=>({p:place(id),avg:a.reduce((s,v)=>s+v,0)/a.length,n:a.length})).sort((a,b)=>b.avg-a.avg||b.n-a.n)}
function withRank(list,val){let prev=null,rk=0;return list.map((x,i)=>{const v=val(x);if(v!==prev){rk=i+1;prev=v}return{x,rk}})}
const cutCard=(r,rk)=>`<div class="card list-item" onclick="go('rec','${r.id}')"><div class="rank">${rk}</div><div class="photo">${cover(r)?`<img data-img="${cover(r)}">`:''}</div><div style="flex:1">${starHtml(r.score)}<div><b>${esc(dog(r.dogId)?.name||'')}</b>　${fmtDate(r.date)}</div><div class="muted">${esc(place(r.placeId).name)}</div></div><span class="muted">›</span></div>`;
const shopCard=(o,rk)=>`<div class="card list-item"><div class="rank">${rk}</div><div style="flex:1"><b>${esc(o.p.name)}</b><div><span class="star">★</span> ${o.avg.toFixed(1)}　<span class="muted">${o.n}回</span></div></div>${o.p.tel&&o.p.id!=='home'?`<a class="minicall" href="${telHref(o.p.tel)}">電話</a>`:''}</div>`;

/* ---- 写真（切り抜かずに保存） ---- */
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadSrc(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function toPhoto(file){
  const url=URL.createObjectURL(file);
  try{const im=await loadSrc(url);const r=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.85)}
  finally{URL.revokeObjectURL(url)}
}

/* ---- 画面の切り替え ---- */
const V={},AFTER={};
let view='home',param=null,backTo=['home',null],wl=null;
function go(v,p){
  if(v==='order'&&view!=='order')backTo=[view,param];
  if(view==='order'&&v!=='order'&&wl){wl.release().catch(()=>{});wl=null}
  view=v;param=p;window.scrollTo(0,0);render()}
function render(){$('#app').innerHTML=V[view](param);hydrate();if(AFTER[view])AFTER[view](param)}
function shell(title,body,back="go('home')"){return `<header>${back?`<button class="back" onclick="${back}">‹ 戻る</button>`:''}<h1>${esc(title)}</h1></header><main>${body}</main>`}
const installHint=()=>navigator.standalone?'':`<div class="card muted">Safariの共有ボタンから「ホーム画面に追加」すると、アプリのように使えて、データも消えにくくなります。</div>`;

/* ---- 通知の編集 ---- */
const remEditor=list=>`<div>${list.map((r,i)=>`<div class="remrow"><select class="rem_d">${DAYS.map(d=>`<option value="${d}" ${d===r.d?'selected':''}>${dayLabel(d)}</option>`).join('')}</select><input type="time" class="rem_t" value="${esc(r.t)}"><button onclick="delRem(${i})">✕</button></div>`).join('')||'<p class="muted">通知なし</p>'}</div><button class="btn sub" onclick="addRem()">＋ 通知を追加</button>`;
function readRems(){return [...document.querySelectorAll('.remrow')].map(el=>({d:Number(el.querySelector('.rem_d').value),t:el.querySelector('.rem_t').value||'09:00'}))}
let RD=null,D=null,R=null;
function remList(){if(view==='recEdit'){syncD();return D.rem}if(view==='resEdit'){syncR();return R.rem}RD=readRems();return RD}
function addRem(){remList().push({d:0,t:'09:00'});render()}
function delRem(i){remList().splice(i,1);render()}

/* ---- 予約（記録の中の予約＋予約だけ） ---- */
function upcoming(){const now=new Date(),a=[];
  for(const r of S.records)if(r.nextAt&&new Date(r.nextAt)>now)a.push({k:'rec',id:r.id,dogId:r.dogId,placeId:r.placeId,at:r.nextAt,menu:r.nextMenu,img:cover(r)});
  for(const x of S.resv)if(x.at&&new Date(x.at)>now){const lr=recsOf(x.dogId)[0];a.push({k:'res',id:x.id,dogId:x.dogId,placeId:x.placeId,at:x.at,menu:x.menu,img:lr?cover(lr):null})}
  return a.sort((x,y)=>x.at.localeCompare(y.at))}
const resRow=(it,first)=>{const p=place(it.placeId);const open=it.k==='rec'?`go('rec','${it.id}')`:`editRes('${it.id}')`;
  return `<div class="list-item" style="padding:10px 0;${first?'':'border-top:1px solid #f3e3e6'}" onclick="${open}"><div class="photo">${it.img?`<img data-img="${it.img}">`:''}</div><div style="flex:1"><b>${fmtDT(it.at)}</b><div class="muted">${esc(dog(it.dogId)?.name)}・${esc(p.name)}</div>${it.menu?`<div class="muted">${esc(it.menu)}</div>`:''}</div>${p.tel&&p.id!=='home'?`<a class="minicall" href="${telHref(p.tel)}" onclick="event.stopPropagation()">電話</a>`:''}<span class="muted">›</span></div>`};

/* ホーム */
V.home=()=>{
  if(!S.dogs.length)return shell(APP_NAME,`<div class="card"><p>まずはワンちゃんを登録しましょう。</p><button class="btn" onclick="go('dogEdit')">ワンちゃんを登録する</button></div>${installHint()}`,'');
  const ups=upcoming();
  let nx='<div class="muted">予約はまだありません</div>';
  if(ups.length){const days=daysTo(ups[0].at);
    nx=`<div class="count">${days===0?'今日':'あと'+days+'日'}</div>${ups.map((it,i)=>resRow(it,i===0)).join('')}<p class="muted" style="margin-bottom:0">押すと予約の詳細が開きます。</p>`}
  nx+=`<button class="btn sub" onclick="newRes()">＋ 予約を追加</button>`;
  const dogs=S.dogs.map(d=>{const r=recsOf(d.id)[0];const days=r?Math.round((new Date(today())-new Date(r.date))/86400000):0;
    return `<div class="card list-item" onclick="go('history','${d.id}')"><div class="photo">${r&&cover(r)?`<img data-img="${cover(r)}">`:''}</div><div style="flex:1"><b>${esc(d.name)}</b><div class="muted">${r?`前回 ${fmtDate(r.date)}（${days}日前）`:'まだ記録がありません'}</div></div><button class="minicall" onclick="event.stopPropagation();go('order',{dog:'${d.id}'})">お店で見せる</button></div>`}).join('');
  const favs=S.favs.length?S.favs.map(f=>`<div class="card list-item" onclick="go('fav','${f.id}')"><div class="photo">${f.img?`<img data-img="${f.img}">`:''}</div><div style="flex:1"><b>${esc(f.name)}</b><div class="muted">${esc(dog(f.dogId)?.name||'')}${f.memo?'・'+esc(f.memo.slice(0,30)):''}</div></div><span class="muted">›</span></div>`).join(''):'<p class="muted">記録の画面の「お気に入りのカットに登録」から追加できます。</p>';
  const top=withRank(rankCuts(''),r=>r.score).slice(0,3);
  const rk=top.length?top.map(o=>cutCard(o.x,o.rk)).join('')+`<button class="btn sub" onclick="go('ranking',{tab:'cut',dog:''})">ランキングをすべて見る</button>`:'<p class="muted">記録に★で点数をつけると、ここにランキングが出ます。</p>';
  return shell(APP_NAME,`
<div class="sec">次回の予約</div><div class="card">${nx}</div>
<button class="btn" onclick="newRec()">記録する</button>
<div class="sec">ワンちゃん</div>${dogs}
<div class="sec">ランキング</div>${rk}
<div class="sec">お気に入りのカット</div>${favs}
<div class="sec">登録・設定</div>
<button class="btn sub" onclick="go('dogEdit')">＋ ワンちゃんを追加</button>
<button class="btn sub" onclick="go('shops')">お店の登録・編集</button>
<button class="btn sub" onclick="openSettings()">設定</button>${installHint()}`,'');
};

/* ランキング画面 */
V.ranking=p=>{p=p||{};const tab=p.tab||'cut',dg=p.dog||'';
  const sel=S.dogs.length>1?`<select onchange="go('ranking',{tab:'${tab}',dog:this.value})" style="margin-top:10px"><option value="">すべてのワンちゃん</option>${S.dogs.map(d=>`<option value="${d.id}" ${d.id===dg?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:'';
  let body;
  if(tab==='cut'){const l=withRank(rankCuts(dg),r=>r.score);body=`<p class="muted">点数の高い順です。同じ点数なら新しい記録が上になります。</p>${l.map(o=>cutCard(o.x,o.rk)).join('')||'<p class="muted">まだ点数がついた記録がありません。</p>'}`}
  else{const l=withRank(rankShops(dg),o=>o.avg.toFixed(1));body=`<p class="muted">お店ごとの点数の平均が高い順です。</p>${l.map(o=>shopCard(o.x,o.rk)).join('')||'<p class="muted">まだ点数がついた記録がありません。</p>'}`}
  return shell('ランキング',`<div class="seg"><button class="${tab==='cut'?'on':''}" onclick="go('ranking',{tab:'cut',dog:'${dg}'})">カット</button><button class="${tab==='shop'?'on':''}" onclick="go('ranking',{tab:'shop',dog:'${dg}'})">お店</button></div>${sel}${body}`)};

/* ワンちゃん */
V.dogEdit=id=>{const d=dog(id)||{};return shell(id?'ワンちゃんの編集':'ワンちゃんの登録',`<label>名前</label><input id="f_name" value="${esc(d.name)}" placeholder="例：モカ"><label>犬種（任意）</label><input id="f_breed" value="${esc(d.breed)}" placeholder="例：トイプードル"><button class="btn" onclick="saveDog('${id||''}')">保存する</button>${id?`<button class="btn danger" onclick="delDog('${id}')">このワンちゃんを削除</button>`:''}`,id?`go('history','${id}')`:"go('home')")};
async function saveDog(id){const name=$('#f_name').value.trim();if(!name)return toast('名前を入れてください');const breed=$('#f_breed').value.trim();if(id)Object.assign(dog(id),{name,breed});else S.dogs.push({id:uid(),name,breed});await save();go('home')}

V.placeEdit=p=>{p=p||{};const pl=S.places.find(x=>x.id===p.id)||{};const back=p.from==='rec'?"go('recEdit')":p.from==='res'?"go('resEdit')":"go('shops')";

async function savePlace(id,from){const name=$('#f_pname').value.trim();if(!name)return toast('店名を入れてください');
  const v=k=>($('#'+k)?.value||'').trim();
  const data={name,tags:normTags(v('f_ptags')),tel:v('f_ptel'),hours:v('f_phours')};let pid=id;
  if(id)Object.assign(S.places.find(x=>x.id===id),data);else{pid=uid();S.places.push({id:pid,...data})}

  if(from==='rec'&&D){D.placeId=pid;go('recEdit')}else if(from==='res'&&R){R.placeId=pid;go('resEdit')}else go('shops')}
async function delPlace(id){if(!confirm('このお店を削除しますか？'))return;S.places=S.places.filter(p=>p.id!==id);await save();go('shops')}

/* 記録の入力 */
function newRec(dogId,fav){dogId=dogId||S.dogs[0].id;const last=S.records.slice().sort((a,b)=>b.created-a.created)[0];const ld=recsOf(dogId)[0];
  D={id:uid(),_new:true,_imgs:[],dogId,placeId:ld?.placeId||last?.placeId||'home',date:today(),time:nowTime(),before:null,after:null,
    menus:ld?.menus?[...ld.menus]:['カット','シャンプー'],price:'',staff:ld?.staff||'',score:0,cond:'',condNote:'',memo:'',nextAt:'',nextMenu:'',
    rem:clone(validRems(S.settings.defRem)),created:Date.now()};
  if(fav){const f=favOf(fav);if(f){D.memo=f.memo||'';if(f.menus?.length)D.menus=[...f.menus];if(f.dogId&&dog(f.dogId))D.dogId=f.dogId}}
  go('recEdit')}
function editRec(id){const r=recOf(id);D={...clone(r),memo:memoOf(r),menus:r.menus||[],time:r.time||'',score:r.score||0,nextMenu:r.nextMenu||'',rem:validRems(r.rem),_imgs:[]};go('recEdit')}
function syncD(){if(!$('#f_date'))return;D.dogId=$('#f_dog').value;D.date=$('#f_date').value;D.time=$('#f_time').value;D.placeId=$('#f_place').value;
  const ch=[...document.querySelectorAll('.chip.on')].map(e=>e.dataset.m);
  const ot=$('#f_mother').value.split(/[、,，\s　]+/).map(s=>s.trim()).filter(Boolean);
  D.menus=[...new Set([...ch,...ot])];
  D.price=$('#f_price').value.replace(/[^\d]/g,'');D.staff=$('#f_staff').value.trim();
  D.cond=$('#f_cond').value;D.condNote=$('#f_condnote').value.trim();
  D.memo=$('#f_memo').value;D.nextAt=$('#f_next').value;D.nextMenu=$('#f_nextmenu').value.trim();D.rem=readRems()}
function setScore(n){D.score=D.score===n?0:n;document.querySelectorAll('#f_stars button').forEach((b,i)=>b.classList.toggle('on',i<D.score))}
function applyFav(id){if(!id)return;syncD();const f=favOf(id);if(!f)return;D.memo=f.memo||'';if(f.menus?.length)D.menus=[...f.menus];render();toast('「'+f.name+'」の内容を入れました')}
V.recEdit=()=>{if(!D)return V.home();
  const ph=(k,l)=>`<div><label>${l}</label><div class="photo" onclick="setPhoto('${k}')">${D[k]?`<img data-img="${D[k]}">`:'タップして<br>撮影・選択'}</div></div>`;
  const other=(D.menus||[]).filter(m=>!MENUS.includes(m)).join('、');
  const favSel=S.favs.length?`<select onchange="applyFav(this.value)" style="margin-bottom:8px"><option value="">★ お気に入りから入力</option>${S.favs.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>`:'';
  return shell(D._new?'記録する':'記録の編集',`
<label>ワンちゃん</label><select id="f_dog">${S.dogs.map(d=>`<option value="${d.id}" ${d.id===D.dogId?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
<label>お店・場所<span class="req">必須</span></label><select id="f_place">${S.places.map(p=>`<option value="${p.id}" ${p.id===D.placeId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
<button class="btn sub" onclick="syncD();go('placeEdit',{from:'rec'})">＋ お店を登録</button>
<div class="row"><div><label>来店日<span class="req">必須</span></label><input type="date" id="f_date" value="${esc(D.date)}"></div><div><label>時間<span class="req">必須</span></label><input type="time" id="f_time" value="${esc(D.time)}"></div></div>
<label>やったこと（タップで選択）</label><div>${MENUS.map(m=>`<span class="chip ${(D.menus||[]).includes(m)?'on':''}" data-m="${esc(m)}" onclick="this.classList.toggle('on')">${esc(m)}</span>`).join('')}</div>
<input id="f_mother" value="${esc(other)}" placeholder="その他（例：マイクロバブル、ヒゲカット）" style="margin-top:8px">

<div class="row">${ph('before','ビフォー（任意）')}${ph('after','アフター')}</div>
<p class="muted">アフターだけでもOKです。写真をタップすると撮り直し・選び直しができます。</p>
<label>点数（任意・同じ★をもう一度押すと取り消し）</label><div class="stars" id="f_stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=(D.score||0)?'on':''}" onclick="setScore(${n})">★</button>`).join('')}</div>
<label>体調（任意）</label><select id="f_cond"><option value="">選ばない</option>${CONDS.map(c=>`<option value="${c}" ${c===D.cond?'selected':''}>${c}</option>`).join('')}</select>
<input id="f_condnote" value="${esc(D.condNote)}" placeholder="気になったこと（例：耳が少し赤い）" style="margin-top:8px">
<label>オーダー内容・メモ（任意）</label>${favSel}<textarea id="f_memo" placeholder="例：顔まわり短め、耳は丸く、体は5mm">${esc(D.memo)}</textarea>
<label>次回の予約日時（任意・予約していなければ空欄でOK）</label><input type="datetime-local" id="f_next" value="${esc(D.nextAt)}">
<label>次回の予約内容（任意）</label><input id="f_nextmenu" value="${esc(D.nextMenu)}" placeholder="例：カット＋シャンプー、顔まわり短め">
<label>通知（「◯日前の◯時」をいくつでも追加できます）</label>${remEditor(D.rem)}
<button class="btn" onclick="saveRec()">保存する</button>`,"cancelRec()")};
async function setPhoto(k){syncD();const f=await pickFile('image/*');if(!f)return;
  try{const id=await putImg(await toPhoto(f));D._imgs.push(id);D[k]=id;if(D.crop)for(const s in D.crop)if(D.crop[s]){delete D.crop[s][k[0]];delete D.crop[s].o}render()}
  catch(e){toast('写真を読み込めませんでした')}}
async function saveRec(){syncD();
  if(!D.placeId)return toast('お店・場所を選んでください');
  if(!D.date)return toast('来店日を入れてください');
  if(!D.time)return toast('来店の時間を入れてください');
  const old=recOf(D.id);
  for(const id of D._imgs)if(id!==D.before&&id!==D.after)await delImg(id);
  if(old)for(const k of['before','after'])if(old[k]&&old[k]!==D[k])await delImg(old[k]);
  const r={...D};delete r._new;delete r._imgs;
  if(old)Object.assign(old,r);else S.records.push(r);
  await save();const id=D.id;D=null;go('rec',id)}
async function cancelRec(){for(const id of D._imgs)await delImg(id);const n=D._new,id=D.id;D=null;n?go('home'):go('rec',id)}

${placeBtns(pl)}</div>

async function delRec(id){if(!confirm('この記録を削除しますか？'))return;const r=recOf(id);await delImg(r.before);await delImg(r.after);S.records=S.records.filter(x=>x.id!==id);await save();go('history',r.dogId)}

/* お気に入りのカット */
async function addFav(id){const r=recOf(id);if(!r)return;

/* お店で見せる（ワンちゃんごと・カットを選べる） */
V.order=p=>{p=p||{};const dg=dog(p.dog)||S.dogs[0];if(!dg)return V.home();
  const recs=recsOf(dg.id),favs=S.favs.filter(f=>f.dogId===dg.id);
  let sel=p.sel||(recs[0]?'r:'+recs[0].id:(favs[0]?'f:'+favs[0].id:''));
  let item=null;
  if(sel.startsWith('r:')){const r=recOf(sel.slice(2));if(r)item={title:(recs[0]&&r.id===recs[0].id?'前回のカット　':'')+fmtDate(r.date),img:cover(r),memo:memoOf(r),menus:r.menus||[]}}
  else if(sel.startsWith('f:')){const f=favOf(sel.slice(2));if(f)item={title:'お気に入り：'+f.name,img:f.img,memo:f.memo,menus:f.menus||[]}}
  const dogSel=S.dogs.length>1?`<select onchange="go('order',{dog:this.value})">${S.dogs.map(d=>`<option value="${d.id}" ${d.id===dg.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:'<div></div>';
  const th=(s,img,label)=>`<div class="thumb ${s===sel?'on':''}" onclick="go('order',{dog:'${dg.id}',sel:'${s}'})"><div class="photo">${img?`<img data-img="${img}">`:''}</div><div>${label}</div></div>`;
  const thumbs=[...favs.map(f=>th('f:'+f.id,f.img,'お気に入り<br>'+esc(f.name))),...recs.slice(0,30).map((r,i)=>th('r:'+r.id,cover(r),(i===0?'前回<br>':'')+fmtDate(r.date)))].join('');
  return `<div class="order"><div class="row" style="align-items:center"><button class="back" style="flex:none" onclick="closeOrder()">‹ 閉じる</button>${dogSel}</div>
<h2>${esc(dg.name)}${dg.breed?`<span class="muted">（${esc(dg.breed)}）</span>`:''}</h2>
${item?`<div class="muted">${esc(item.title)}</div>
${item.img?`<div class="photo big" style="max-width:420px;margin:12px auto 0"><img data-img="${item.img}"></div>`:''}
${item.memo?`<div class="memo">${esc(item.memo)}</div>`:'<div class="muted" style="margin-top:16px">オーダー内容のメモはありません</div>'}
${item.menus.length?`<div style="font-size:18px;margin-top:12px">${esc(item.menus.join('・'))}</div>`:''}`:'<p>まだ記録がありません。</p>'}
${thumbs?`<div class="sec">ほかのカットを選ぶ</div><div class="thumbs">${thumbs}</div>`:''}</div>`};
AFTER.order=async()=>{try{if(!wl&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}};
function closeOrder(){go(backTo[0],backTo[1])}

/* 投稿画像 */
let CMP=null;const IMGS={};
function openCompare(id){const r=recOf(id);CMP={id,size:'post',mode:r&&r.before&&r.after?'both':'after',style:0,off:[]};go('compare',id)}
const cmpSize=()=>CMP.size==='story'?[1080,1920]:[1080,1350];
function slots(){const r=recOf(CMP.id),[W,H]=cmpSize(),m=40,top=150,bot=90,ah=H-top-bot;
  if(CMP.mode==='both'&&r.before&&r.after){
    if(CMP.size==='post'){const w=(W-3*m)/2;return[{k:'b',id:r.before,l:'BEFORE',x:m,y:top,w,h:ah},{k:'a',id:r.after,l:'AFTER',x:2*m+w,y:top,w,h:ah}]}
    const h=(ah-m)/2;return[{k:'b',id:r.before,l:'BEFORE',x:m,y:top,w:W-2*m,h},{k:'a',id:r.after,l:'AFTER',x:m,y:top+h+m,w:W-2*m,h}]}
  return[{k:'o',id:r.after||r.before,l:r.after?'AFTER':'',x:m,y:top,w:W-2*m,h:ah}]}
function cropOf(k){const r=recOf(CMP.id);if(!r.crop||typeof r.crop!=='object')r.crop={};const c=r.crop[CMP.size]=r.crop[CMP.size]||{};
  let v=c[k];if(!v||!isFinite(v.z)||!isFinite(v.x)||!isFinite(v.y)||v.z<1)v=c[k]={z:1,x:0,y:0};return v}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function draw(){const cv=$('#cmp');if(!cv||!CMP)return;const r=recOf(CMP.id),[W,H]=cmpSize(),st=STYLES[CMP.style]||STYLES[0],x=cv.getContext('2d');
  cv.width=W;cv.height=H;x.fillStyle=st.bg;x.fillRect(0,0,W,H);
  x.fillStyle=st.text;x.textAlign='center';x.textBaseline='middle';x.font=`bold 54px ${FONT}`;
  x.fillText(`${dog(r.dogId)?.name||''}　${fmtDate(r.date)}`,W/2,80);
  for(const s of slots()){x.save();rr(x,s.x,s.y,s.w,s.h,24);x.clip();x.fillStyle='#e9e9e9';x.fillRect(s.x,s.y,s.w,s.h);
    const im=IMGS[s.id];
    if(im){const c=cropOf(s.k),base=Math.max(s.w/im.naturalWidth,s.h/im.naturalHeight),sc=base*c.z,dw=im.naturalWidth*sc,dh=im.naturalHeight*sc,mx=(dw-s.w)/2/s.w,my=(dh-s.h)/2/s.h;
      c.x=Math.max(-mx,Math.min(mx,c.x));c.y=Math.max(-my,Math.min(my,c.y));
      x.drawImage(im,s.x+(s.w-dw)/2+c.x*s.w,s.y+(s.h-dh)/2+c.y*s.h,dw,dh)}
    x.restore();
    if(s.l){x.font=`bold 34px ${FONT}`;const tw=x.measureText(s.l).width;x.fillStyle=st.label;rr(x,s.x+18,s.y+18,tw+40,60,30);x.fill();
      x.fillStyle=st.labelText;x.textAlign='left';x.fillText(s.l,s.x+38,s.y+49);x.textAlign='center'}}
  x.fillStyle=st.text;x.globalAlpha=.8;x.font=`30px ${FONT}`;x.fillText(APP_NAME,W/2,H-45);x.globalAlpha=1}
function bindCmp(){const cv=$('#cmp');if(!cv)return;const pts=new Map();let act=null,raf=0;
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
    if(!pts.size)act=slots().find(s=>p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h)||null;pts.set(e.pointerId,p)});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!act)return;e.preventDefault();
    const prev=pts.get(e.pointerId),cur=pos(e),c=cropOf(act.k);
    if(pts.size===1){c.x+=(cur.x-prev.x)/act.w;c.y+=(cur.y-prev.y)/act.h}
    else{const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];const d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(cur.x-o.x,cur.y-o.y);
      if(d0>0)c.z=Math.min(5,Math.max(1,c.z*d1/d0));c.x+=(cur.x-prev.x)/2/act.w;c.y+=(cur.y-prev.y)/2/act.h}
    pts.set(e.pointerId,cur);redraw()});
  const end=e=>{if(!pts.delete(e.pointerId))return;if(!pts.size){act=null;save()}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end)}
function tagList(){const r=recOf(CMP.id),p=place(r.placeId);return[...new Set([shopTag(p),...tagsOf(p),APP_TAG].filter(Boolean))]}
const tagText=()=>tagList().filter(t=>!CMP.off.includes(t)).join(' ');
function toggleTag(i){const t=tagList()[i];CMP.off=CMP.off.includes(t)?CMP.off.filter(x=>x!==t):[...CMP.off,t];render()}
function setCmp(k,v){CMP[k]=k==='style'?Number(v):v;render()}
async function resetCrop(){const r=recOf(CMP.id);if(r.crop&&r.crop[CMP.size])for(const s of slots())delete r.crop[CMP.size][s.k];await save();draw()}
V.compare=id=>{const r=recOf(id);if(!r)return V.home();
  if(!CMP||CMP.id!==id)CMP={id,size:'post',mode:r.before&&r.after?'both':'after',style:0,off:[]};
  if(!r.before&&!r.after)return shell('投稿画像',`<p>写真がありません。記録を編集して写真を入れてください。</p>`,`go('rec','${id}')`);
  const both=r.before&&r.after;if(!both)CMP.mode='after';
  const seg=(k,obj)=>`<div class="seg" style="margin-top:8px">${Object.entries(obj).map(([v,l])=>`<button class="${String(CMP[k])===v?'on':''}" onclick="setCmp('${k}','${v}')">${esc(l)}</button>`).join('')}</div>`;
  const tags=tagList().map((t,i)=>`<span class="tag ${CMP.off.includes(t)?'off':''}" onclick="toggleTag(${i})">${esc(t)}</span>`).join('');
  return shell('投稿画像を作る',`${both?seg('mode',MODES):''}${seg('size',SIZES)}${seg('style',Object.fromEntries(STYLES.map((s,i)=>[String(i),s.name])))}
<canvas id="cmp"></canvas><p class="muted" style="text-align:center;margin-top:4px">写真を指で動かせます。2本指で拡大・縮小</p>
<button class="btn sub" onclick="resetCrop()">位置を元に戻す</button>
<label>ハッシュタグ（押すとオン・オフ）</label><div>${tags}</div>
<button class="btn sub" onclick="copyText(tagText())">① ハッシュタグをコピー</button>
<button class="btn" onclick="shareImg()">② インスタなどに共有</button>
<p class="muted">インスタの文章欄を長押しして「ペースト」すると、ハッシュタグが入ります。</p>`,`go('rec','${id}')`)};
AFTER.compare=async id=>{const r=recOf(id);if(!r)return;
  for(const k of['before','after'])if(r[k]&&!IMGS[r[k]]){const d=await getImg(r[k]);if(d)IMGS[r[k]]=await loadSrc(d)}
  draw();bindCmp()};
function dataToFile(d,name){const[h,b]=d.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:mime})}
function shareImg(){const cv=$('#cmp');if(!cv)return;const data=cv.toDataURL('image/jpeg',0.92);const f=dataToFile(data,'trimlog.jpg');
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=data;a.download='trimlog.jpg';a.click()}}
function copyText(t){const done=()=>toast('コピーしました');
  function fb(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}

/* カレンダー */
const icsDT=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00';
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function addCal(id){const r=recOf(id);if(!r)return;calItem({dogId:r.dogId,placeId:r.placeId,at:r.nextAt,menu:r.nextMenu,rem:validRems(r.rem)})}
function calItem(o){const d=dog(o.dogId),p=place(o.placeId),start=new Date(o.at);
  if(!o.at||isNaN(start))return toast('予約日時が入っていません');
  const end=new Date(start.getTime()+3600000),title=`${d?.name||''} トリミング（${p.name}）`;
  const desc=[o.menu?'予約内容：'+o.menu:'',p.tel&&p.id!=='home'?'電話：'+p.tel:''].filter(Boolean).join('\n');
  const al=validRems(o.rem).map(x=>{const t=new Date(start);t.setDate(t.getDate()-x.d);const[h,m]=String(x.t||'09:00').split(':').map(Number);t.setHours(h||0,m||0,0,0);return t}).sort((a,b)=>a-b);
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//trimlog//JP','CALSCALE:GREGORIAN'];
  const ev=(s,e,sum,als)=>{L.push('BEGIN:VEVENT','UID:'+uid()+'@trimlog','DTSTAMP:'+icsUTC(new Date()),'DTSTART:'+icsDT(s),'DTEND:'+icsDT(e),'SUMMARY:'+icsEsc(sum));
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));if(p.id!=='home')L.push('LOCATION:'+icsEsc(p.name));
    for(const a of als)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(sum),a,'END:VALARM');L.push('END:VEVENT')};
  ev(start,end,title,al.slice(0,2).map(t=>'TRIGGER;VALUE=DATE-TIME:'+icsUTC(t)));
  al.slice(2).forEach(t=>ev(t,new Date(t.getTime()+900000),'【通知】'+title,['TRIGGER:PT0M']));
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));document.body.appendChild(a);a.click();a.remove();
  if(al.length>2)toast('通知が3つ以上あるので、カレンダーで「すべてを追加」を選んでください')}

/* 設定・バックアップ */
let BK=null;
function openSettings(){RD=clone(validRems(S.settings.defRem));BK=null;go('settings')}
V.settings=()=>shell('設定',`<div class="sec">通知の初期設定</div><p class="muted">新しく記録・予約するとき、最初から入る通知です。</p>${remEditor(RD||[])}
<button class="btn" onclick="saveDefRem()">通知の初期設定を保存</button>
<div class="sec">バックアップ</div><p class="muted">データはこのiPhoneの中だけに保存されています。ときどきバックアップを取っておくと安心です。</p>
${BK?`<button class="btn" onclick="shareBK()">バックアップファイルを保存する</button>`:`<button class="btn sub" onclick="makeBK()">バックアップを作る</button>`}
<button class="btn sub" onclick="restoreBK()">バックアップから戻す</button>`);
async function saveDefRem(){RD=readRems();S.settings.defRem=clone(RD);await save();toast('保存しました')}
async function makeBK(){RD=readRems();const ids=new Set();S.records.forEach(r=>{if(r.before)ids.add(r.before);if(r.after)ids.add(r.after)});S.favs.forEach(f=>{if(f.img)ids.add(f.img)});
  const imgs={};for(const id of ids){const v=await getImg(id);if(v)imgs[id]=v}
  BK=new File([JSON.stringify({v:1,S,imgs})],`trimlog-backup-${today()}.json`,{type:'application/json'});render();toast('準備できました。「保存する」を押してください')}
function shareBK(){if(!BK)return;if(navigator.canShare&&navigator.canShare({files:[BK]}))navigator.share({files:[BK]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(BK);a.download=BK.name;a.click()}}
async function restoreBK(){const f=await pickFile('.json,application/json');if(!f)return;
  let o;try{o=JSON.parse(await f.text())}catch(e){return toast('ファイルを読めませんでした')}
  if(!o||!o.S)return toast('バックアップファイルではないようです');
  if(!confirm('今のデータを消して、バックアップの内容に置き換えます。よろしいですか？'))return;
  await dbClear();imgCache.clear();for(const[k,v]of Object.entries(o.imgs||{}))await dbSet(k,v);
  S=o.S;fixS();await save();toast('戻しました');go('home')}

/* 起動 */
function fixS(){S.dogs=S.dogs||[];S.places=S.places||[];S.records=S.records||[];S.favs=S.favs||[];S.resv=S.resv||[];S.settings=S.settings||{};
  if(!Array.isArray(S.settings.defRem))S.settings.defRem=clone(DEF_REM);
  if(!S.places.some(p=>p.id==='home'))S.places.unshift({id:'home',name:'自宅',tags:['#おうちトリミング','#セルフトリミング']});
  S.places.forEach(p=>p.tags=tagsOf(p));S.records.forEach(r=>{if(!r.created)r.created=0;if(!r.date)r.date=today()})}
(async()=>{try{await openDB();const s=await dbGet('state');if(s)S=s;fixS();await save();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});render()}
  catch(e){document.body.innerHTML='<p style="padding:20px">データを読み込めませんでした。Safariを開き直してください。</p>'}})();
</script>
